<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Curtain Academy — ระบบเรียนรู้ผ้าม่าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f1b2d;--navy-light:#1a2d47;--navy-mid:#243b5c;
  --gold:#c8a44e;--gold-light:#e8c96a;--gold-dim:#8a7034;
  --cream:#f5f0e8;--cream-dark:#e8dfd0;
  --white:#ffffff;--text:#2c2c2c;--text-light:#6b6b6b;
  --success:#2d8a4e;--danger:#c0392b;--info:#2980b9;
  --radius:12px;--radius-sm:8px;--radius-lg:18px;
  --shadow:0 4px 24px rgba(15,27,45,.12);
  --shadow-lg:0 12px 48px rgba(15,27,45,.18);
  --transition:all .3s cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans Thai',sans-serif;
  background:var(--cream);color:var(--text);
  min-height:100vh;line-height:1.6;
  overflow-x:hidden;
}
#root{min-height:100vh;display:flex;flex-direction:column}

/* ─── Scrollbar ─── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--navy-mid);border-radius:99px}

/* ─── Animations ─── */
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes curtainDrop{from{transform:scaleY(0);transform-origin:top}to{transform:scaleY(1);transform-origin:top}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(400px) rotate(720deg);opacity:0}}
.fade-in{animation:fadeIn .5s ease forwards}
.slide-in{animation:slideIn .4s ease forwards}

/* ─── Typography ─── */
.font-display{font-family:'Playfair Display',serif}
h1,h2,h3{font-weight:700}

/* ─── Buttons ─── */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 22px;border-radius:var(--radius-sm);
  font-weight:600;font-size:.9rem;cursor:pointer;
  border:none;transition:var(--transition);
  font-family:inherit;text-decoration:none;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--navy);color:var(--gold);box-shadow:0 2px 12px rgba(15,27,45,.3)}
.btn-primary:hover{background:var(--navy-light);box-shadow:0 4px 20px rgba(15,27,45,.4)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy);box-shadow:0 2px 12px rgba(200,164,78,.3)}
.btn-gold:hover{box-shadow:0 4px 20px rgba(200,164,78,.5);transform:translateY(-1px)}
.btn-outline{background:transparent;border:2px solid var(--navy);color:var(--navy)}
.btn-outline:hover{background:var(--navy);color:var(--white)}
.btn-danger{background:var(--danger);color:var(--white)}
.btn-danger:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.82rem}
.btn-lg{padding:14px 32px;font-size:1rem;border-radius:var(--radius)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ─── Form ─── */
.input{
  width:100%;padding:10px 14px;border:2px solid var(--cream-dark);
  border-radius:var(--radius-sm);font-size:.9rem;font-family:inherit;
  background:var(--white);transition:var(--transition);
}
.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,78,.2)}
.label{display:block;font-weight:600;font-size:.85rem;margin-bottom:4px;color:var(--navy)}
select.input{cursor:pointer}
textarea.input{resize:vertical;min-height:80px}

/* ─── Card ─── */
.card{
  background:var(--white);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);overflow:hidden;transition:var(--transition);
}
.card:hover{box-shadow:var(--shadow-lg)}

/* ─── Badge ─── */
.badge{
  display:inline-flex;align-items:center;padding:3px 10px;
  border-radius:99px;font-size:.75rem;font-weight:600;
}
.badge-gold{background:rgba(200,164,78,.15);color:var(--gold-dim)}
.badge-success{background:rgba(45,138,78,.12);color:var(--success)}
.badge-danger{background:rgba(192,57,43,.12);color:var(--danger)}
.badge-info{background:rgba(41,128,185,.12);color:var(--info)}

/* ─── Nav ─── */
.nav{
  background:var(--navy);position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px rgba(15,27,45,.3);
}
.nav-inner{
  max-width:1280px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  height:64px;
}
.nav-brand{
  font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;
  color:var(--gold);display:flex;align-items:center;gap:10px;
}
.nav-brand svg{width:28px;height:28px}
.nav-links{display:flex;gap:4px;align-items:center}
.nav-link{
  padding:8px 14px;color:rgba(255,255,255,.7);font-size:.85rem;
  font-weight:500;border-radius:var(--radius-sm);cursor:pointer;
  transition:var(--transition);border:none;background:none;font-family:inherit;
}
.nav-link:hover,.nav-link.active{color:var(--gold);background:rgba(200,164,78,.1)}
.nav-user{
  display:flex;align-items:center;gap:10px;color:var(--white);font-size:.85rem;
}
.nav-avatar{
  width:34px;height:34px;border-radius:50%;background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  color:var(--navy);font-weight:700;font-size:.85rem;
}
.nav-mobile-toggle{display:none;background:none;border:none;color:var(--gold);cursor:pointer;font-size:1.4rem}

/* ─── Layout ─── */
.container{max-width:1200px;margin:0 auto;padding:24px}
.page-header{margin-bottom:32px}
.page-title{font-size:1.8rem;color:var(--navy);margin-bottom:4px;font-family:'Playfair Display',serif}
.page-sub{color:var(--text-light);font-size:.95rem}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

/* ─── Login ─── */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--navy);position:relative;overflow:hidden;
}
.login-bg{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 20% 50%,rgba(200,164,78,.08) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 20%,rgba(36,59,92,.5) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 80%,rgba(200,164,78,.05) 0%,transparent 50%);
}
.login-curtain{
  position:absolute;top:0;width:100%;height:100%;
  background:repeating-linear-gradient(90deg,
    rgba(200,164,78,.03) 0px,rgba(200,164,78,.03) 2px,
    transparent 2px,transparent 40px);
  animation:curtainDrop 1.5s ease forwards;
}
.login-card{
  position:relative;z-index:2;width:420px;max-width:92vw;
  background:rgba(255,255,255,.04);backdrop-filter:blur(20px);
  border:1px solid rgba(200,164,78,.2);border-radius:var(--radius-lg);
  padding:48px 36px;animation:fadeIn .8s ease;
}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo h1{
  font-family:'Playfair Display',serif;color:var(--gold);
  font-size:2rem;margin-bottom:4px;
}
.login-logo p{color:rgba(255,255,255,.5);font-size:.85rem}
.login-card .label{color:rgba(255,255,255,.7)}
.login-card .input{
  background:rgba(255,255,255,.06);border-color:rgba(200,164,78,.2);
  color:var(--white);
}
.login-card .input:focus{border-color:var(--gold)}
.login-card .input::placeholder{color:rgba(255,255,255,.3)}
.login-hint{
  margin-top:24px;padding:16px;border-radius:var(--radius-sm);
  background:rgba(200,164,78,.08);border:1px solid rgba(200,164,78,.15);
}
.login-hint p{color:rgba(255,255,255,.6);font-size:.78rem;margin-bottom:4px}
.login-hint code{color:var(--gold);font-size:.78rem}

/* ─── Dashboard cards ─── */
.stat-card{
  padding:24px;border-radius:var(--radius);
  background:var(--white);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:16px;
}
.stat-icon{
  width:50px;height:50px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
}
.stat-value{font-size:1.6rem;font-weight:800;color:var(--navy);line-height:1}
.stat-label{font-size:.82rem;color:var(--text-light);margin-top:2px}

/* ─── Lesson Card ─── */
.lesson-card{
  position:relative;border-radius:var(--radius-lg);overflow:hidden;
  background:var(--white);box-shadow:var(--shadow);
  transition:var(--transition);cursor:pointer;
}
.lesson-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.lesson-card.locked{opacity:.65;cursor:not-allowed}
.lesson-card.locked:hover{transform:none}
.lesson-cover{
  height:140px;display:flex;align-items:center;justify-content:center;
  font-size:3rem;position:relative;overflow:hidden;
}
.lesson-cover::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(transparent 40%,rgba(0,0,0,.4));
}
.lesson-body{padding:20px}
.lesson-num{
  font-size:.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:2px;color:var(--gold-dim);margin-bottom:4px;
}
.lesson-title{font-size:1.05rem;font-weight:700;color:var(--navy);margin-bottom:6px}
.lesson-desc{font-size:.82rem;color:var(--text-light);margin-bottom:12px;line-height:1.5}
.lesson-footer{display:flex;align-items:center;justify-content:space-between}
.lock-overlay{
  position:absolute;inset:0;background:rgba(15,27,45,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:2.5rem;z-index:2;backdrop-filter:blur(2px);
}

/* ─── Lesson Content ─── */
.lesson-content{max-width:800px;margin:0 auto}
.lesson-content h2{font-size:1.4rem;color:var(--navy);margin:24px 0 12px;font-family:'Playfair Display',serif}
.lesson-content h3{font-size:1.1rem;color:var(--navy-mid);margin:18px 0 8px}
.lesson-content p{margin-bottom:12px;line-height:1.8;color:var(--text)}
.lesson-content ul{margin:8px 0 16px 20px}
.lesson-content li{margin-bottom:6px;line-height:1.6}
.lesson-content .highlight-box{
  padding:18px 20px;border-radius:var(--radius-sm);margin:16px 0;
  background:linear-gradient(135deg,rgba(200,164,78,.08),rgba(200,164,78,.03));
  border-left:4px solid var(--gold);
}
.lesson-content .info-box{
  padding:18px 20px;border-radius:var(--radius-sm);margin:16px 0;
  background:rgba(41,128,185,.06);border-left:4px solid var(--info);
}
.lesson-nav{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:32px;padding-top:24px;border-top:2px solid var(--cream-dark);
}

/* ─── Quiz ─── */
.quiz-container{max-width:700px;margin:0 auto}
.quiz-header{text-align:center;margin-bottom:32px}
.quiz-progress{
  display:flex;gap:6px;justify-content:center;margin-top:16px;
}
.quiz-dot{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:700;transition:var(--transition);
}
.quiz-dot.current{background:var(--gold);color:var(--navy);transform:scale(1.15)}
.quiz-dot.correct{background:var(--success);color:var(--white)}
.quiz-dot.wrong{background:var(--danger);color:var(--white)}
.quiz-dot.pending{background:var(--cream-dark);color:var(--text-light)}
.quiz-question{
  font-size:1.1rem;font-weight:600;color:var(--navy);
  margin-bottom:20px;line-height:1.6;
}
.quiz-option{
  display:block;width:100%;text-align:left;padding:14px 18px;
  margin-bottom:10px;border:2px solid var(--cream-dark);
  border-radius:var(--radius-sm);background:var(--white);
  font-size:.92rem;cursor:pointer;transition:var(--transition);
  font-family:inherit;color:var(--text);
}
.quiz-option:hover{border-color:var(--gold);background:rgba(200,164,78,.04)}
.quiz-option.selected{border-color:var(--navy);background:rgba(15,27,45,.04)}
.quiz-option.correct-answer{border-color:var(--success);background:rgba(45,138,78,.08);color:var(--success)}
.quiz-option.wrong-answer{border-color:var(--danger);background:rgba(192,57,43,.08);color:var(--danger)}
.quiz-result{text-align:center;padding:40px 20px}
.quiz-score{font-size:4rem;font-weight:800;font-family:'Playfair Display',serif}
.quiz-score.perfect{color:var(--gold);animation:pulse .6s ease}
.quiz-score.fail{color:var(--danger)}

/* ─── Calculator ─── */
.calc-wrap{max-width:700px;margin:0 auto}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.calc-result{
  margin-top:24px;padding:24px;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--navy),var(--navy-light));
  color:var(--white);
}
.calc-result-row{
  display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.calc-result-row:last-child{border:none;font-weight:700;font-size:1.1rem;color:var(--gold)}

/* ─── Game ─── */
.game-board{
  display:grid;gap:12px;max-width:600px;margin:20px auto;
}
.game-card-cell{
  aspect-ratio:1;border-radius:var(--radius-sm);cursor:pointer;
  perspective:600px;
}
.game-card-inner{
  position:relative;width:100%;height:100%;transition:transform .5s;
  transform-style:preserve-3d;
}
.game-card-cell.flipped .game-card-inner{transform:rotateY(180deg)}
.game-card-cell.matched .game-card-inner{transform:rotateY(180deg)}
.game-card-front,.game-card-back{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:var(--radius-sm);display:flex;align-items:center;
  justify-content:center;font-size:1.4rem;font-weight:700;
}
.game-card-front{
  background:linear-gradient(135deg,var(--navy),var(--navy-mid));
  color:var(--gold);font-size:1.8rem;
}
.game-card-back{
  background:var(--white);border:2px solid var(--cream-dark);
  transform:rotateY(180deg);font-size:.75rem;
  padding:8px;text-align:center;color:var(--navy);
  flex-direction:column;gap:4px;
}
.game-card-cell.matched .game-card-back{
  border-color:var(--success);background:rgba(45,138,78,.06);
}
.game-timer{
  text-align:center;font-size:1.8rem;font-weight:800;
  color:var(--navy);font-family:'Playfair Display',serif;
}

/* ─── Admin Tables ─── */
.data-table{width:100%;border-collapse:separate;border-spacing:0}
.data-table th{
  text-align:left;padding:12px 16px;font-size:.78rem;
  text-transform:uppercase;letter-spacing:1px;
  color:var(--text-light);border-bottom:2px solid var(--cream-dark);
  font-weight:600;
}
.data-table td{
  padding:12px 16px;border-bottom:1px solid var(--cream-dark);
  font-size:.88rem;vertical-align:middle;
}
.data-table tr:hover td{background:rgba(200,164,78,.04)}

/* ─── Modal ─── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,27,45,.5);
  backdrop-filter:blur(4px);z-index:200;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s ease;
}
.modal-content{
  background:var(--white);border-radius:var(--radius-lg);
  width:500px;max-width:92vw;max-height:85vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);
}
.modal-header{
  padding:20px 24px;border-bottom:1px solid var(--cream-dark);
  display:flex;justify-content:space-between;align-items:center;
}
.modal-header h3{font-size:1.1rem;color:var(--navy)}
.modal-close{
  background:none;border:none;font-size:1.3rem;cursor:pointer;
  color:var(--text-light);transition:var(--transition);
}
.modal-close:hover{color:var(--danger)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--cream-dark);display:flex;gap:8px;justify-content:flex-end}
.form-group{margin-bottom:16px}

/* ─── Toast ─── */
.toast-container{position:fixed;top:80px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{
  padding:12px 20px;border-radius:var(--radius-sm);
  color:var(--white);font-size:.88rem;font-weight:500;
  animation:slideIn .3s ease;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;
}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-info{background:var(--info)}

/* ─── Confetti ─── */
.confetti-piece{
  position:fixed;width:10px;height:10px;z-index:999;
  animation:confetti 2s ease forwards;pointer-events:none;
}

/* ─── Responsive ─── */
@media(max-width:768px){
  .grid-2,.grid-3,.calc-grid{grid-template-columns:1fr}
  .nav-links{
    display:none;position:absolute;top:64px;left:0;right:0;
    background:var(--navy);flex-direction:column;padding:12px;
    border-bottom:2px solid var(--gold);
  }
  .nav-links.open{display:flex}
  .nav-mobile-toggle{display:block}
  .container{padding:16px}
  .page-title{font-size:1.4rem}
  .login-card{padding:32px 24px}
  .stat-card{padding:16px}
  .game-board{max-width:100%}
}
@media(max-width:480px){
  .lesson-cover{height:100px}
  .nav-user span{display:none}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, createContext, useContext } = React;

/* ════════════════════════════════════════════

  {id:"u3",name:"นักเรียน สมศักดิ์",email:"student@curtain.com",role:"student",password:"1234"},
];

const LESSON_COLORS = [
  "linear-gradient(135deg,#1a2d47,#2d4a6f)",
  "linear-gradient(135deg,#2d4a3f,#3d6a5f)",
  "linear-gradient(135deg,#4a2d47,#6a3d5f)",
  "linear-gradient(135deg,#4a3d2d,#6a5a3d)",
  "linear-gradient(135deg,#2d3d4a,#3d5a6a)",
];
const LESSON_ICONS = ["🪟","🔧","📏","🧮","💰"];

const INITIAL_LESSONS = [
  {
    id:"L1",title:"ชนิดของผ้าม่าน",icon:"🪟",color:LESSON_COLORS[0],
    description:"ทำความรู้จักผ้าม่านประเภทต่างๆ ตั้งแต่ม่านตาไก่ ม่านจีบ ไปจนถึงม่านพับ",
    content:`<h2>บทที่ 1: ความรู้พื้นฐานเกี่ยวกับชนิดของผ้าม่าน</h2>
<p>ผ้าม่านเป็นองค์ประกอบสำคัญของการตกแต่งภายใน ไม่เพียงแต่ช่วยกรองแสง แต่ยังช่วยเสริมความสวยงามให้กับห้อง การเลือกผ้าม่านที่เหมาะสมจำเป็นต้องเข้าใจชนิดของผ้าม่านแต่ละแบบ</p>

<h3>1. ม่านตาไก่ (Eyelet/Grommet Curtains)</h3>
<p>ม่านตาไก่เป็นม่านที่มีรูกลมเจาะที่ส่วนบนของผ้า สอดรางม่านผ่านรูเหล่านี้โดยตรง ให้ลุคที่ทันสมัยและสะอาดตา เหมาะกับห้องนั่งเล่นและห้องนอนสไตล์โมเดิร์น</p>

<h3>2. ม่านจีบ (Pleated Curtains)</h3>

<li><strong>จีบ 3 นิ้ว (Triple Pleat):</strong> จีบละเอียดกว่า ดูเป็นทางการมาก</li>
<li><strong>จีบดินสอ (Pencil Pleat):</strong> จีบเล็กๆ เรียงตัวสม่ำเสมอ ใช้ได้ทุกสไตล์</li>
</ul>

<h3>4. ม่านม้วน (Roller Blinds)</h3>

const AppContext = createContext();

function useToast(){
  const [toasts,setToasts]=useState([]);
  const addToast=useCallback((msg,type="success")=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3000);
  },[]);
  return {toasts,addToast};
}

function Toast({toasts}){
  if(!toasts.length) return null;
  return <div className="toast-container">{toasts.map(t=>(
    <div key={t.id} className={`toast toast-${t.type}`}>
      {t.type==="success"?"✓":t.type==="error"?"✗":"ℹ"} {t.msg}
    </div>
  ))}</div>;
}

  return(
    <div className="login-wrap">

/* ──── Quiz ──── */
function QuizPage({lesson,lessonIndex,onBack,onPass,addToast}){
  const [questions,setQuestions]=useState([]);
  const [current,setCurrent]=useState(0);
  const [selected,setSelected]=useState(null);
  const [answered,setAnswered]=useState(false);
  const [results,setResults]=useState([]);
  const [done,setDone]=useState(false);

  useEffect(()=>{
    // pick 10 random from pool
    const pool=[...lesson.quizPool];
    const shuffled=pool.sort(()=>Math.random()-.5).slice(0,10);
    // also shuffle options for each
    const prepared=shuffled.map(q=>{
      const optPairs=q.opts.map((o,i)=>({text:o,origIdx:i}));
      optPairs.sort(()=>Math.random()-.5);
      const newAns=optPairs.findIndex(p=>p.origIdx===q.ans);
      return{q:q.q,opts:optPairs.map(p=>p.text),ans:newAns};
    });
    setQuestions(prepared);
  },[lesson]);

  if(!questions.length) return null;

  const handleSelect=(idx)=>{
    if(answered) return;
    setSelected(idx);
  };
  const handleConfirm=()=>{
    if(selected===null) return;
    setAnswered(true);
    const correct=selected===questions[current].ans;
    setResults(p=>[...p,correct]);
  };
  const handleNext=()=>{
    if(current<questions.length-1){
      setCurrent(c=>c+1);
      setSelected(null);
      setAnswered(false);
    } else {
      setDone(true);
    }
  };
  const handleRetry=()=>{
    const pool=[...lesson.quizPool];
    const shuffled=pool.sort(()=>Math.random()-.5).slice(0,10);
    const prepared=shuffled.map(q=>{
      const optPairs=q.opts.map((o,i)=>({text:o,origIdx:i}));
      optPairs.sort(()=>Math.random()-.5);
      const newAns=optPairs.findIndex(p=>p.origIdx===q.ans);
      return{q:q.q,opts:optPairs.map(p=>p.text),ans:newAns};
    });
    setQuestions(prepared);
    setCurrent(0);setSelected(null);setAnswered(false);setResults([]);setDone(false);
  };

  const score=results.filter(Boolean).length;
  const perfect=score===10;

  if(done){
    return(
      <div className="container fade-in">
        <div className="card" style={{padding:40}}>
          <div className="quiz-result">
            {perfect && <Confetti/>}
            <div style={{fontSize:"4rem",marginBottom:16}}>{perfect?"🎉":"😢"}</div>
            <div className={`quiz-score ${perfect?"perfect":"fail"}`}>{score}/10</div>
            <p style={{fontSize:"1.2rem",margin:"16px 0",color:perfect?"var(--success)":"var(--danger)"}}>
              {perfect?"ยอดเยี่ยม! คุณผ่านบทนี้แล้ว!":"ต้องได้ 10/10 ถึงจะผ่าน ลองอีกครั้งนะ!"}
            </p>
            <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
              {perfect ? (
                <button className="btn btn-gold btn-lg" onClick={()=>{onPass(lesson.id);addToast("ปลดล็อกบทถัดไปแล้ว! 🎉")}}>
                  ดำเนินการต่อ →
                </button>
              ):(
                <button className="btn btn-primary btn-lg" onClick={handleRetry}>
                  ลองอีกครั้ง ↺
                </button>
              )}
              <button className="btn btn-outline" onClick={onBack}>กลับหน้าบทเรียน</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  const q=questions[current];
  return(
    <div className="container fade-in">
      <button className="btn btn-outline btn-sm" onClick={onBack} style={{marginBottom:20}}>← กลับ</button>
      <div className="card" style={{padding:"32px 36px"}}>
        <div className="quiz-container">
          <div className="quiz-header">
            <h2 className="font-display" style={{color:"var(--navy)"}}>
              แบบทดสอบ: {lesson.title}
            </h2>
            <div className="quiz-progress">
              {questions.map((_,i)=>(
                <div key={i} className={`quiz-dot ${
                  i===current?"current":
                  i<results.length?(results[i]?"correct":"wrong"):"pending"
                }`}>{i+1}</div>
              ))}
            </div>
          </div>
          <div style={{marginBottom:8,fontSize:".82rem",color:"var(--text-light)"}}>
            ข้อที่ {current+1} จาก {questions.length}
          </div>
          <div className="quiz-question">{q.q}</div>
          {q.opts.map((o,i)=>{
            let cls="quiz-option";
            if(answered){
              if(i===q.ans) cls+=" correct-answer";
              else if(i===selected) cls+=" wrong-answer";
            } else if(i===selected) cls+=" selected";
            return <button key={i} className={cls} onClick={()=>handleSelect(i)}>{o}</button>;
          })}
          <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:16}}>
            {!answered ? (
              <button className="btn btn-primary" disabled={selected===null} onClick={handleConfirm}>ยืนยันคำตอบ</button>
            ):(
              <button className="btn btn-gold" onClick={handleNext}>
                {current<questions.length-1?"ข้อถัดไป →":"ดูผลลัพธ์"}
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function MatchGame({onBack}){
  const [cards,setCards]=useState([]);
  const [flipped,setFlipped]=useState([]);
  const [matched,setMatched]=useState([]);
  const [moves,setMoves]=useState(0);
  const [gameWon,setGameWon]=useState(false);
  const lockRef=useRef(false);

  useEffect(()=>{
    const pairs=GAME_PAIRS.slice(0,6);
    const deck=[];
    pairs.forEach(p=>{
      deck.push({uid:p.id+"a",pairId:p.id,text:p.text,type:"th"});
      deck.push({uid:p.id+"b",pairId:p.id,text:p.match,type:"en"});
    });
    deck.sort(()=>Math.random()-.5);
    setCards(deck);
  },[]);

  const handleFlip=(idx)=>{
    if(lockRef.current) return;
    if(flipped.includes(idx)||matched.includes(cards[idx].pairId)) return;
    const newFlipped=[...flipped,idx];
    setFlipped(newFlipped);
    if(newFlipped.length===2){
      setMoves(m=>m+1);
      lockRef.current=true;
      const [a,b]=newFlipped;
      if(cards[a].pairId===cards[b].pairId){
        setTimeout(()=>{
          const newMatched=[...matched,cards[a].pairId];
          setMatched(newMatched);
          setFlipped([]);
          lockRef.current=false;
          if(newMatched.length===6) setGameWon(true);
        },600);
      } else {
        setTimeout(()=>{setFlipped([]);lockRef.current=false;},1000);
      }
    }
  };

  return(
    <div className="container fade-in">
      <button className="btn btn-outline btn-sm" onClick={onBack} style={{marginBottom:20}}>← กลับ</button>
      <div className="card" style={{padding:32}}>
        <div style={{textAlign:"center",marginBottom:20}}>
          <h2 className="font-display" style={{color:"var(--navy)"}}>🃏 เกมจับคู่ผ้าม่าน</h2>
          <p style={{color:"var(--text-light)",fontSize:".88rem"}}>จับคู่ชื่อไทย-อังกฤษ | จำนวนครั้งที่เปิด: {moves}</p>
        </div>
        {gameWon && <Confetti/>}
        {gameWon ? (
          <div style={{textAlign:"center",padding:40}}>
            <div style={{fontSize:"4rem",marginBottom:16}}>🎉</div>
            <h3 style={{color:"var(--gold)",fontSize:"1.6rem",fontFamily:"'Playfair Display',serif"}}>ยินดีด้วย!</h3>
            <p style={{margin:"12px 0",color:"var(--text-light)"}}>คุณจับคู่ครบแล้วใน {moves} ครั้ง</p>
            <button className="btn btn-gold" onClick={()=>{
              setGameWon(false);setMoves(0);setMatched([]);setFlipped([]);
              const pairs=GAME_PAIRS.slice(0,6);const deck=[];
              pairs.forEach(p=>{deck.push({uid:p.id+"a",pairId:p.id,text:p.text,type:"th"});deck.push({uid:p.id+"b",pairId:p.id,text:p.match,type:"en"});});
              deck.sort(()=>Math.random()-.5);setCards(deck);
            }}>เล่นอีกครั้ง</button>
          </div>
        ):(
          <div className="game-board" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
            {cards.map((c,i)=>{
              const isFlipped=flipped.includes(i);
              const isMatched=matched.includes(c.pairId);
              return(
                <div key={c.uid} className={`game-card-cell ${isFlipped?"flipped":""} ${isMatched?"matched":""}`}
                  onClick={()=>handleFlip(i)}>
                  <div className="game-card-inner">
                    <div className="game-card-front">🪟</div>
                    <div className="game-card-back">
                      <span style={{fontSize:c.type==="th"?".85rem":".75rem"}}>{c.text}</span>
                      <span style={{fontSize:".6rem",color:"var(--text-light)"}}>{c.type==="th"?"🇹🇭":"🇬🇧"}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function SpeedCalcGame({onBack}){
  const [qIdx,setQIdx]=useState(0);
  const [answer,setAnswer]=useState("");
  const [score,setScore]=useState(0);
  const [timeLeft,setTimeLeft]=useState(60);
  const [gameOver,setGameOver]=useState(false);
  const [feedback,setFeedback]=useState(null);
  const timerRef=useRef();

  const questions=[
    {q:"ราง 2 เมตร, จีบ ×2.5 → ความกว้างผ้ารวม (ซม.)?",a:500},
    {q:"ราง 3 เมตร, จีบ ×2 → ความกว้างผ้ารวม (ซม.)?",a:600},
    {q:"ความกว้าง 700 ซม. ÷ ผ้า 140 ซม. = กี่หน้า?",a:5},
    {q:"ความกว้าง 500 ซม. ÷ ผ้า 140 ซม. = กี่หน้า? (ปัดขึ้น)",a:4},
    {q:"สูง 260 ซม. + ค่าพับ 25 ซม. = ความยาวต่อหน้า?",a:285},
    {q:"6 หน้า × 285 ซม. ÷ 100 = ผ้ากี่เมตร? (ปัดทศนิยม 1 ตำแหน่ง × 10)",a:171},
    {q:"ผ้า 17 เมตร × 450 บาท = กี่บาท?",a:7650},
    {q:"วงกบกว้าง 150 ซม. เผื่อข้างละ 20 ซม. → ความกว้างราง?",a:190},
    {q:"ราง 4 เมตร, จีบ ×1.5 → ความกว้างผ้ารวม (ซม.)?",a:600},
    {q:"5 หน้า × ค่าเย็บ 300 บาท = เท่าไหร่?",a:1500},
  ];

  useEffect(()=>{
    timerRef.current=setInterval(()=>{
      setTimeLeft(t=>{
        if(t<=1){clearInterval(timerRef.current);setGameOver(true);return 0;}
        return t-1;
      });
    },1000);
    return()=>clearInterval(timerRef.current);
  },[]);

  const handleSubmit=(e)=>{
    e.preventDefault();
    if(gameOver) return;
    const ans=parseInt(answer);
    const correct=ans===questions[qIdx].a;
    if(correct){
      setScore(s=>s+1);
      setFeedback("correct");
    } else {
      setFeedback("wrong");
    }
    setTimeout(()=>{
      setFeedback(null);
      setAnswer("");
      if(qIdx<questions.length-1) setQIdx(i=>i+1);
      else {clearInterval(timerRef.current);setGameOver(true);}
    },800);
  };

  if(gameOver){
    return(
      <div className="container fade-in">
        <button className="btn btn-outline btn-sm" onClick={onBack} style={{marginBottom:20}}>← กลับ</button>
        <div className="card" style={{padding:40,textAlign:"center"}}>
          <div style={{fontSize:"4rem",marginBottom:16}}>⏱️</div>
          <h2 className="font-display" style={{color:"var(--navy)"}}>หมดเวลา!</h2>
          <div style={{fontSize:"3rem",fontWeight:800,color:"var(--gold)",margin:"16px 0"}}>{score}/{questions.length}</div>
          <p style={{color:"var(--text-light)"}}>คุณตอบถูก {score} ข้อ จาก {questions.length} ข้อ</p>
          <button className="btn btn-gold" style={{marginTop:20}} onClick={()=>{
            setQIdx(0);setScore(0);setTimeLeft(60);setGameOver(false);setAnswer("");
            timerRef.current=setInterval(()=>{setTimeLeft(t=>{if(t<=1){clearInterval(timerRef.current);setGameOver(true);return 0;}return t-1;});},1000);
          }}>เล่นอีกครั้ง</button>
        </div>
      </div>
    );
  }

  return(
    <div className="container fade-in">
      <button className="btn btn-outline btn-sm" onClick={()=>{clearInterval(timerRef.current);onBack()}} style={{marginBottom:20}}>← กลับ</button>
      <div className="card" style={{padding:32}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <h2 className="font-display" style={{color:"var(--navy)"}}>⚡ คำนวณแข่งเวลา</h2>
          <div className="game-timer" style={{color:timeLeft<=10?"var(--danger)":"var(--navy)",marginTop:8}}>
            ⏱️ {timeLeft} วินาที
          </div>
          <p style={{color:"var(--text-light)",fontSize:".85rem",marginTop:4}}>คะแนน: {score} | ข้อ {qIdx+1}/{questions.length}</p>
        </div>
        <div style={{maxWidth:500,margin:"0 auto"}}>
          <div className="quiz-question" style={{
            background:feedback==="correct"?"rgba(45,138,78,.1)":feedback==="wrong"?"rgba(192,57,43,.1)":"transparent",
            padding:16,borderRadius:"var(--radius-sm)",transition:"background .3s"
          }}>
            {questions[qIdx].q}
          </div>
          <form onSubmit={handleSubmit} style={{display:"flex",gap:10,marginTop:16}}>
            <input className="input" type="number" placeholder="พิมพ์คำตอบ..." value={answer}
              onChange={e=>setAnswer(e.target.value)} autoFocus style={{fontSize:"1.1rem",flex:1}}/>
            <button type="submit" className="btn btn-gold">ตอบ</button>
          </form>
        </div>
      </div>
    </div>
  );
}

/* ──── Admin: User Management ──── */
function UserManagement({users,setUsers,addToast}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({name:"",email:"",role:"student",password:"1234"});

  const openAdd=()=>{setForm({name:"",email:"",role:"student",password:"1234"});setModal("add")};
  const openEdit=(u)=>{setForm({...u});setModal("edit")};
  const handleSave=()=>{
    if(!form.name||!form.email){addToast("กรุณากรอกข้อมูลให้ครบ","error");return;}
    if(modal==="add"){
      const newUser={...form,id:"u"+Date.now()};
      setUsers(p=>[...p,newUser]);
      addToast("เพิ่มผู้ใช้สำเร็จ");
    } else {
      setUsers(p=>p.map(u=>u.id===form.id?{...form}:u));
      addToast("แก้ไขผู้ใช้สำเร็จ");
    }
    setModal(null);
  };
  const handleDelete=(id)=>{
    if(confirm("ต้องการลบผู้ใช้นี้?")){
      setUsers(p=>p.filter(u=>u.id!==id));
      addToast("ลบผู้ใช้แล้ว","info");
    }
  };

  return(
    <div className="container fade-in">
      <div className="page-header" style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
        <div><h1 className="page-title font-display">👥 จัดการผู้ใช้</h1><p className="page-sub">เพิ่ม แก้ไข ลบ ผู้ใช้ในระบบ</p></div>
        <button className="btn btn-gold" onClick={openAdd}>+ เพิ่มผู้ใช้</button>
      </div>
      <div className="card" style={{overflow:"auto"}}>
        <table className="data-table">
          <thead><tr><th>ชื่อ</th><th>อีเมล</th><th>บทบาท</th><th>จัดการ</th></tr></thead>
          <tbody>
            {users.map(u=>(
              <tr key={u.id}>
                <td style={{fontWeight:600}}>{u.name}</td>
                <td>{u.email}</td>
                <td><span className={`badge ${u.role==="admin"?"badge-danger":u.role==="instructor"?"badge-info":"badge-success"}`}>
                  {u.role==="admin"?"ผู้ดูแล":u.role==="instructor"?"ผู้สอน":"ผู้เรียน"}
                </span></td>
                <td style={{display:"flex",gap:6}}>
                  <button className="btn btn-sm btn-outline" onClick={()=>openEdit(u)}>✏️ แก้ไข</button>
                  <button className="btn btn-sm btn-danger" onClick={()=>handleDelete(u.id)}>🗑️</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {modal && (
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="modal-content" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <h3>{modal==="add"?"เพิ่มผู้ใช้ใหม่":"แก้ไขผู้ใช้"}</h3>
              <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-group"><label className="label">ชื่อ</label><input className="input" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))}/></div>
              <div className="form-group"><label className="label">อีเมล</label><input className="input" type="email" value={form.email} onChange={e=>setForm(p=>({...p,email:e.target.value}))}/></div>
              <div className="form-group"><label className="label">รหัสผ่าน</label><input className="input" value={form.password} onChange={e=>setForm(p=>({...p,password:e.target.value}))}/></div>
              <div className="form-group">
                <label className="label">บทบาท</label>
                <select className="input" value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))}>
                  <option value="student">ผู้เรียน</option>
                  <option value="instructor">ผู้สอน</option>
                  <option value="admin">ผู้ดูแล</option>
                </select>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-outline" onClick={()=>setModal(null)}>ยกเลิก</button>
              <button className="btn btn-gold" onClick={handleSave}>💾 บันทึก</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ──── Admin/Instructor: Quiz Management ──── */
function QuizManagement({lessons,setLessons,addToast}){
  const [selectedLesson,setSelectedLesson]=useState(lessons[0]?.id||"");
  const [modal,setModal]=useState(null);
  const [editQ,setEditQ]=useState(null);
  const [form,setForm]=useState({q:"",opts:["","","",""],ans:0});

  const lesson=lessons.find(l=>l.id===selectedLesson);
  const pool=lesson?.quizPool||[];

  const openAdd=()=>{setForm({q:"",opts:["","","",""],ans:0});setEditQ(null);setModal("add")};
  const openEdit=(q,idx)=>{setForm({q:q.q,opts:[...q.opts],ans:q.ans});setEditQ(idx);setModal("edit")};

  const handleSave=()=>{
    if(!form.q || form.opts.some(o=>!o)){addToast("กรุณากรอกข้อมูลให้ครบ","error");return;}
    setLessons(prev=>prev.map(l=>{
      if(l.id!==selectedLesson) return l;
      const newPool=[...l.quizPool];
      if(modal==="add") newPool.push({...form});
      else newPool[editQ]={...form};
      return {...l,quizPool:newPool};
    }));
    addToast(modal==="add"?"เพิ่มข้อสอบสำเร็จ":"แก้ไขข้อสอบสำเร็จ");
    setModal(null);
  };

  const handleDelete=(idx)=>{
    if(!confirm("ลบข้อสอบนี้?")) return;
    setLessons(prev=>prev.map(l=>{
      if(l.id!==selectedLesson) return l;
      const newPool=l.quizPool.filter((_,i)=>i!==idx);
      return {...l,quizPool:newPool};
    }));
    addToast("ลบข้อสอบแล้ว","info");
  };

  return(
    <div className="container fade-in">
      <div className="page-header" style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
        <div><h1 className="page-title font-display">📝 จัดการ Quiz</h1><p className="page-sub">เพิ่ม แก้ไข ลบ ข้อสอบในคลัง</p></div>
        <button className="btn btn-gold" onClick={openAdd}>+ เพิ่มข้อสอบ</button>
      </div>

      <div className="form-group" style={{maxWidth:300,marginBottom:20}}>
        <label className="label">เลือกบทเรียน</label>
        <select className="input" value={selectedLesson} onChange={e=>setSelectedLesson(e.target.value)}>
          {lessons.map((l,i)=><option key={l.id} value={l.id}>บทที่ {i+1}: {l.title}</option>)}
        </select>
      </div>

      <div className="card" style={{overflow:"auto"}}>
        <table className="data-table">
          <thead><tr><th>#</th><th>คำถาม</th><th>ตัวเลือก</th><th>คำตอบ</th><th>จัดการ</th></tr></thead>
          <tbody>
            {pool.map((q,i)=>(
              <tr key={i}>
                <td>{i+1}</td>
                <td style={{maxWidth:250}}>{q.q}</td>
                <td style={{fontSize:".8rem",maxWidth:200}}>{q.opts.join(" | ")}</td>
                <td><span className="badge badge-success">{q.opts[q.ans]}</span></td>
                <td style={{display:"flex",gap:6}}>
                  <button className="btn btn-sm btn-outline" onClick={()=>openEdit(q,i)}>✏️</button>
                  <button className="btn btn-sm btn-danger" onClick={()=>handleDelete(i)}>🗑️</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        <div style={{padding:16,fontSize:".85rem",color:"var(--text-light)"}}>
          รวม {pool.length} ข้อ ในคลัง (สุ่ม 10 ข้อต่อการทดสอบ)
        </div>
      </div>

      {modal && (
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="modal-content" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <h3>{modal==="add"?"เพิ่มข้อสอบใหม่":"แก้ไขข้อสอบ"}</h3>
              <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-group">
                <label className="label">คำถาม</label>
                <textarea className="input" value={form.q} onChange={e=>setForm(p=>({...p,q:e.target.value}))}/>
              </div>
              {form.opts.map((o,i)=>(
                <div className="form-group" key={i}>
                  <label className="label">ตัวเลือกที่ {i+1} {i===form.ans && "✅ (คำตอบถูก)"}</label>
                  <div style={{display:"flex",gap:8}}>
                    <input className="input" value={o} onChange={e=>{
                      const newOpts=[...form.opts];newOpts[i]=e.target.value;
                      setForm(p=>({...p,opts:newOpts}));
                    }}/>
                    <button type="button" className={`btn btn-sm ${i===form.ans?"btn-gold":"btn-outline"}`}
                      onClick={()=>setForm(p=>({...p,ans:i}))}>
                      {i===form.ans?"✓ ถูก":"ตั้งเป็นคำตอบ"}
                    </button>
                  </div>
                </div>
              ))}
            </div>
            <div className="modal-footer">
              <button className="btn btn-outline" onClick={()=>setModal(null)}>ยกเลิก</button>
              <button className="btn btn-gold" onClick={handleSave}>💾 บันทึก</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════
   MAIN APP
   ════════════════════════════════════════════ */
function App(){
  const [user,setUser]=useState(null);
  const [page,setPage]=useState("dashboard");
  const [users,setUsers]=useState(INITIAL_USERS);
  const [lessons,setLessons]=useState(INITIAL_LESSONS);
  const [progress,setProgress]=useState({});
  const [selectedLesson,setSelectedLesson]=useState(null);
  const [lessonIndex,setLessonIndex]=useState(0);
  const [viewMode,setViewMode]=useState("list"); // list | content | quiz
  const {toasts,addToast}=useToast();

  const handleLogin=(u)=>{setUser(u);setPage("dashboard");addToast(`ยินดีต้อนรับ ${u.name}`)};
  const handleLogout=()=>{setUser(null);setPage("dashboard");setViewMode("list");setSelectedLesson(null)};
  const handleSelectLesson=(l,i)=>{setSelectedLesson(l);setLessonIndex(i);setViewMode("content");setPage("lessons")};
  const handlePassQuiz=(lessonId)=>{setProgress(p=>({...p,[lessonId]:true}));setViewMode("list")};

  if(!user) return <><LoginPage onLogin={handleLogin} users={users}/><Toast toasts={toasts}/></>;

  let content;
  if(page==="dashboard") content=<Dashboard user={user} lessons={lessons} progress={progress} users={users}/>;
  else if(page==="lessons"){
    if(viewMode==="quiz" && selectedLesson)
      content=<QuizPage lesson={selectedLesson} lessonIndex={lessonIndex}
        onBack={()=>setViewMode("content")} onPass={handlePassQuiz} addToast={addToast}/>;
    else if(viewMode==="content" && selectedLesson)
      content=<LessonView lesson={selectedLesson} lessonIndex={lessonIndex}
        onBack={()=>{setViewMode("list");setSelectedLesson(null)}}
        onStartQuiz={()=>setViewMode("quiz")}/>;
    else
      content=<LessonsList lessons={lessons} progress={progress} user={user} onSelectLesson={handleSelectLesson}/>;
  }
  else if(page==="calculator") content=<Calculator/>;
  else if(page==="game") content=<GamePage/>;
  else if(page==="users" && user.role==="admin") content=<UserManagement users={users} setUsers={setUsers} addToast={addToast}/>;
  else if(page==="quiz-manage" && (user.role==="admin"||user.role==="instructor")) content=<QuizManagement lessons={lessons} setLessons={setLessons} addToast={addToast}/>;
  else content=<Dashboard user={user} lessons={lessons} progress={progress} users={users}/>;

  return(
    <>
      <Navbar user={user} page={page} setPage={(p)=>{setPage(p);setViewMode("list");setSelectedLesson(null)}} onLogout={handleLogout}/>
      <main style={{flex:1,paddingBottom:40}}>{content}</main>
      <footer style={{
        background:"var(--navy)",padding:"20px 24px",textAlign:"center",
        color:"rgba(255,255,255,.4)",fontSize:".8rem"
      }}>
        Curtain Academy © 2026 — ระบบเรียนรู้ผ้าม่านออนไลน์ | Powered by React
      </footer>
      <Toast toasts={toasts}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
