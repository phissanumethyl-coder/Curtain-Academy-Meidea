<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Curtain Academy — ระบบเรียนรู้ผ้าม่าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet"/>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f1b2d;--navy-light:#1a2d47;--navy-mid:#243b5c;
  --gold:#c8a44e;--gold-light:#e8c96a;--gold-dim:#8a7034;
  --cream:#f5f0e8;--cream-dark:#e8dfd0;
  --white:#ffffff;--text:#2c2c2c;--text-light:#6b6b6b;
  --success:#2d8a4e;--danger:#c0392b;--info:#2980b9;
  --radius:12px;--radius-sm:8px;--radius-lg:18px;
  --shadow:0 4px 24px rgba(15,27,45,.12);
  --shadow-lg:0 12px 48px rgba(15,27,45,.18);
  --transition:all .3s cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;line-height:1.6;overflow-x:hidden}
#root{min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--navy-mid);border-radius:99px}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes curtainDrop{from{transform:scaleY(0);transform-origin:top}to{transform:scaleY(1);transform-origin:top}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(400px) rotate(720deg);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .5s ease forwards}
.slide-in{animation:slideIn .4s ease forwards}
.font-display{font-family:'Playfair Display',serif}
h1,h2,h3{font-weight:700}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:var(--radius-sm);font-weight:600;font-size:.9rem;cursor:pointer;border:none;transition:var(--transition);font-family:inherit;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--navy);color:var(--gold);box-shadow:0 2px 12px rgba(15,27,45,.3)}
.btn-primary:hover{background:var(--navy-light)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy);box-shadow:0 2px 12px rgba(200,164,78,.3)}
.btn-gold:hover{box-shadow:0 4px 20px rgba(200,164,78,.5);transform:translateY(-1px)}
.btn-outline{background:transparent;border:2px solid var(--navy);color:var(--navy)}
.btn-outline:hover{background:var(--navy);color:var(--white)}
.btn-danger{background:var(--danger);color:var(--white)}
.btn-danger:hover{opacity:.85}
.btn-success{background:var(--success);color:var(--white)}
.btn-sm{padding:6px 14px;font-size:.82rem}
.btn-lg{padding:14px 32px;font-size:1rem;border-radius:var(--radius)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.input{width:100%;padding:10px 14px;border:2px solid var(--cream-dark);border-radius:var(--radius-sm);font-size:.9rem;font-family:inherit;background:var(--white);transition:var(--transition)}
.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,78,.2)}
.label{display:block;font-weight:600;font-size:.85rem;margin-bottom:4px;color:var(--navy)}
select.input{cursor:pointer}
textarea.input{resize:vertical;min-height:80px}

.card{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;transition:var(--transition)}
.card:hover{box-shadow:var(--shadow-lg)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600}
.badge-gold{background:rgba(200,164,78,.15);color:var(--gold-dim)}
.badge-success{background:rgba(45,138,78,.12);color:var(--success)}
.badge-danger{background:rgba(192,57,43,.12);color:var(--danger)}
.badge-info{background:rgba(41,128,185,.12);color:var(--info)}

.nav{background:var(--navy);position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(15,27,45,.3)}
.nav-inner{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-brand{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:10px;cursor:pointer}
.nav-links{display:flex;gap:4px;align-items:center}
.nav-link{padding:8px 14px;color:rgba(255,255,255,.7);font-size:.85rem;font-weight:500;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);border:none;background:none;font-family:inherit}
.nav-link:hover,.nav-link.active{color:var(--gold);background:rgba(200,164,78,.1)}
.nav-user{display:flex;align-items:center;gap:10px;color:var(--white);font-size:.85rem}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:700;font-size:.85rem}
.nav-mobile-toggle{display:none;background:none;border:none;color:var(--gold);cursor:pointer;font-size:1.4rem}

.container{max-width:1200px;margin:0 auto;padding:24px}
.page-title{font-size:1.8rem;color:var(--navy);margin-bottom:4px;font-family:'Playfair Display',serif}
.page-sub{color:var(--text-light);font-size:.95rem}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);position:relative;overflow:hidden}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(200,164,78,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(36,59,92,.5) 0%,transparent 50%)}
.login-curtain{position:absolute;top:0;width:100%;height:100%;background:repeating-linear-gradient(90deg,rgba(200,164,78,.03) 0px,rgba(200,164,78,.03) 2px,transparent 2px,transparent 40px);animation:curtainDrop 1.5s ease forwards}
.login-card{position:relative;z-index:2;width:420px;max-width:92vw;background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border:1px solid rgba(200,164,78,.2);border-radius:var(--radius-lg);padding:48px 36px;animation:fadeIn .8s ease}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo h1{font-family:'Playfair Display',serif;color:var(--gold);font-size:2rem;margin-bottom:4px}
.login-logo p{color:rgba(255,255,255,.5);font-size:.85rem}
.login-card .label{color:rgba(255,255,255,.7)}
.login-card .input{background:rgba(255,255,255,.06);border-color:rgba(200,164,78,.2);color:var(--white)}
.login-card .input:focus{border-color:var(--gold)}
.login-card .input::placeholder{color:rgba(255,255,255,.3)}
.login-hint{margin-top:24px;padding:16px;border-radius:var(--radius-sm);background:rgba(200,164,78,.08);border:1px solid rgba(200,164,78,.15)}
.login-hint p{color:rgba(255,255,255,.6);font-size:.78rem;margin-bottom:4px}
.login-hint code{color:var(--gold);font-size:.78rem}

.stat-card{padding:24px;border-radius:var(--radius);background:var(--white);box-shadow:var(--shadow);display:flex;align-items:center;gap:16px}
.stat-icon{width:50px;height:50px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.stat-value{font-size:1.6rem;font-weight:800;color:var(--navy);line-height:1}
.stat-label{font-size:.82rem;color:var(--text-light);margin-top:2px}

.lesson-card{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:var(--white);box-shadow:var(--shadow);transition:var(--transition);cursor:pointer}
.lesson-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.lesson-card.locked{opacity:.65;cursor:not-allowed}
.lesson-card.locked:hover{transform:none}
.lesson-cover{height:140px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.lesson-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.4))}
.lesson-body{padding:20px}
.lesson-num{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--gold-dim);margin-bottom:4px}
.lesson-title{font-size:1.05rem;font-weight:700;color:var(--navy);margin-bottom:6px}
.lesson-desc{font-size:.82rem;color:var(--text-light);margin-bottom:12px;line-height:1.5}
.lesson-footer{display:flex;align-items:center;justify-content:space-between}
.lock-overlay{position:absolute;inset:0;background:rgba(15,27,45,.3);display:flex;align-items:center;justify-content:center;font-size:2.5rem;z-index:2;backdrop-filter:blur(2px)}

.lesson-content{max-width:800px;margin:0 auto}
.lesson-content h2{font-size:1.4rem;color:var(--navy);margin:24px 0 12px;font-family:'Playfair Display',serif}
.lesson-content h3{font-size:1.1rem;color:var(--navy-mid);margin:18px 0 8px}
.lesson-content p{margin-bottom:12px;line-height:1.8;color:var(--text)}
.lesson-content ul{margin:8px 0 16px 20px}
.lesson-content li{margin-bottom:6px;line-height:1.6}
.lesson-content .highlight-box{padding:18px 20px;border-radius:var(--radius-sm);margin:16px 0;background:linear-gradient(135deg,rgba(200,164,78,.08),rgba(200,164,78,.03));border-left:4px solid var(--gold)}
.lesson-content .info-box{padding:18px 20px;border-radius:var(--radius-sm);margin:16px 0;background:rgba(41,128,185,.06);border-left:4px solid var(--info)}
.lesson-content img{max-width:100%;border-radius:var(--radius-sm);margin:12px 0;box-shadow:var(--shadow)}
.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:24px;border-top:2px solid var(--cream-dark)}

/* ── Rich Editor ── */
.editor-toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;background:var(--cream);border-bottom:2px solid var(--cream-dark);border-radius:var(--radius-sm) var(--radius-sm) 0 0;position:sticky;top:64px;z-index:10}
.editor-toolbar button{padding:6px 10px;border:1px solid var(--cream-dark);border-radius:4px;background:var(--white);cursor:pointer;font-size:.82rem;transition:var(--transition);font-family:inherit;color:var(--text);min-width:32px}
.editor-toolbar button:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.editor-toolbar button.active{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.editor-toolbar .sep{width:1px;background:var(--cream-dark);margin:0 4px;align-self:stretch}
.editor-area{min-height:400px;padding:24px;outline:none;border:2px solid var(--cream-dark);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);background:var(--white);font-size:.95rem;line-height:1.8;overflow-y:auto}
.editor-area:focus{border-color:var(--gold)}
.editor-area h2{font-size:1.4rem;color:var(--navy);margin:20px 0 10px;font-family:'Playfair Display',serif}
.editor-area h3{font-size:1.1rem;color:var(--navy-mid);margin:16px 0 8px}
.editor-area img{max-width:100%;border-radius:var(--radius-sm);margin:10px 0;cursor:pointer}
.editor-area p{margin-bottom:10px}
.editor-area ul,.editor-area ol{margin:8px 0 14px 20px}
.editor-area blockquote{border-left:4px solid var(--gold);padding:12px 16px;background:rgba(200,164,78,.06);margin:12px 0;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.editor-area table{border-collapse:collapse;width:100%;margin:12px 0}
.editor-area td,.editor-area th{border:1px solid var(--cream-dark);padding:8px 12px;text-align:left}
.editor-area th{background:var(--cream);font-weight:600}

.img-upload-zone{border:2px dashed var(--cream-dark);border-radius:var(--radius-sm);padding:24px;text-align:center;cursor:pointer;transition:var(--transition);margin:12px 0;background:rgba(200,164,78,.02)}
.img-upload-zone:hover{border-color:var(--gold);background:rgba(200,164,78,.06)}
.img-upload-zone.dragging{border-color:var(--gold);background:rgba(200,164,78,.1)}
.img-preview-grid{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.img-preview-item{position:relative;width:120px;height:90px;border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow)}
.img-preview-item img{width:100%;height:100%;object-fit:cover}
.img-preview-item .img-remove{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:var(--white);border:none;cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center}
.img-insert-btn{position:absolute;bottom:4px;left:4px;padding:2px 8px;border-radius:4px;background:var(--navy);color:var(--gold);border:none;cursor:pointer;font-size:.7rem}

.upload-progress{height:4px;background:var(--cream-dark);border-radius:99px;overflow:hidden;margin-top:8px}
.upload-progress-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));transition:width .3s;border-radius:99px}

.spinner{width:20px;height:20px;border:3px solid var(--cream-dark);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}

/* Quiz */
.quiz-container{max-width:700px;margin:0 auto}
.quiz-progress{display:flex;gap:6px;justify-content:center;margin-top:16px}
.quiz-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;transition:var(--transition)}
.quiz-dot.current{background:var(--gold);color:var(--navy);transform:scale(1.15)}
.quiz-dot.correct{background:var(--success);color:var(--white)}
.quiz-dot.wrong{background:var(--danger);color:var(--white)}
.quiz-dot.pending{background:var(--cream-dark);color:var(--text-light)}
.quiz-question{font-size:1.1rem;font-weight:600;color:var(--navy);margin-bottom:20px;line-height:1.6}
.quiz-option{display:block;width:100%;text-align:left;padding:14px 18px;margin-bottom:10px;border:2px solid var(--cream-dark);border-radius:var(--radius-sm);background:var(--white);font-size:.92rem;cursor:pointer;transition:var(--transition);font-family:inherit;color:var(--text)}
.quiz-option:hover{border-color:var(--gold);background:rgba(200,164,78,.04)}
.quiz-option.selected{border-color:var(--navy);background:rgba(15,27,45,.04)}
.quiz-option.correct-answer{border-color:var(--success);background:rgba(45,138,78,.08);color:var(--success)}
.quiz-option.wrong-answer{border-color:var(--danger);background:rgba(192,57,43,.08);color:var(--danger)}
.quiz-result{text-align:center;padding:40px 20px}
.quiz-score{font-size:4rem;font-weight:800;font-family:'Playfair Display',serif}
.quiz-score.perfect{color:var(--gold);animation:pulse .6s ease}
.quiz-score.fail{color:var(--danger)}

.calc-wrap{max-width:700px;margin:0 auto}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.calc-result{margin-top:24px;padding:24px;border-radius:var(--radius);background:linear-gradient(135deg,var(--navy),var(--navy-light));color:var(--white)}
.calc-result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.calc-result-row:last-child{border:none;font-weight:700;font-size:1.1rem;color:var(--gold)}

.game-board{display:grid;gap:12px;max-width:600px;margin:20px auto}
.game-card-cell{aspect-ratio:1;border-radius:var(--radius-sm);cursor:pointer;perspective:600px}
.game-card-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.game-card-cell.flipped .game-card-inner,.game-card-cell.matched .game-card-inner{transform:rotateY(180deg)}
.game-card-front,.game-card-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-weight:700}
.game-card-front{background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:var(--gold);font-size:1.8rem}
.game-card-back{background:var(--white);border:2px solid var(--cream-dark);transform:rotateY(180deg);font-size:.75rem;padding:8px;text-align:center;color:var(--navy);flex-direction:column;gap:4px}
.game-card-cell.matched .game-card-back{border-color:var(--success);background:rgba(45,138,78,.06)}
.game-timer{text-align:center;font-size:1.8rem;font-weight:800;color:var(--navy);font-family:'Playfair Display',serif}

.data-table{width:100%;border-collapse:separate;border-spacing:0}
.data-table th{text-align:left;padding:12px 16px;font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);border-bottom:2px solid var(--cream-dark);font-weight:600}
.data-table td{padding:12px 16px;border-bottom:1px solid var(--cream-dark);font-size:.88rem;vertical-align:middle}
.data-table tr:hover td{background:rgba(200,164,78,.04)}

.modal-overlay{position:fixed;inset:0;background:rgba(15,27,45,.5);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.modal-content{background:var(--white);border-radius:var(--radius-lg);width:500px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-content.wide{width:900px}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--cream-dark);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:1.1rem;color:var(--navy)}
.modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text-light);transition:var(--transition)}
.modal-close:hover{color:var(--danger)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--cream-dark);display:flex;gap:8px;justify-content:flex-end}
.form-group{margin-bottom:16px}

.toast-container{position:fixed;top:80px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius-sm);color:var(--white);font-size:.88rem;font-weight:500;animation:slideIn .3s ease;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-info{background:var(--info)}
.confetti-piece{position:fixed;width:10px;height:10px;z-index:999;animation:confetti 2s ease forwards;pointer-events:none}

/* Firebase config banner */
.config-banner{background:linear-gradient(135deg,#fff3cd,#ffeaa7);border:2px solid #f0c040;border-radius:var(--radius);padding:20px 24px;margin-bottom:24px}
.config-banner h3{color:#856404;margin-bottom:8px}
.config-banner p{font-size:.88rem;color:#856404;margin-bottom:4px}
.config-banner code{background:rgba(0,0,0,.08);padding:2px 6px;border-radius:4px;font-size:.82rem}

.tabs{display:flex;gap:2px;background:var(--cream-dark);padding:3px;border-radius:var(--radius-sm);margin-bottom:20px}
.tab{flex:1;padding:10px;text-align:center;border-radius:6px;cursor:pointer;font-weight:600;font-size:.88rem;border:none;background:transparent;font-family:inherit;color:var(--text-light);transition:var(--transition)}
.tab.active{background:var(--white);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1)}

@media(max-width:768px){
  .grid-2,.grid-3,.calc-grid{grid-template-columns:1fr}
  .nav-links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--navy);flex-direction:column;padding:12px;border-bottom:2px solid var(--gold)}
  .nav-links.open{display:flex}
  .nav-mobile-toggle{display:block}
  .container{padding:16px}
  .page-title{font-size:1.4rem}
  .login-card{padding:32px 24px}
  .editor-toolbar{position:static}
  .modal-content.wide{width:95vw}
}
@media(max-width:480px){.lesson-cover{height:100px}.nav-user span{display:none}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useCallback,useRef,createContext,useContext}=React;

/* ══════════════════════════════════════════
   FIREBASE CONFIG — แก้ค่าตรงนี้ให้ตรงกับ Firebase project ของคุณ
   ══════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "000000000000",
  appId: "YOUR_APP_ID"

/* ── Firebase Init ── */

    content:`<h2>บทที่ 1: ความรู้พื้นฐานเกี่ยวกับชนิดของผ้าม่าน</h2><p>ผ้าม่านเป็นองค์ประกอบสำคัญของการตกแต่งภายใน ไม่เพียงแต่ช่วยกรองแสง แต่ยังช่วยเสริมความสวยงามให้กับห้อง</p><h3>1. ม่านตาไก่ (Eyelet/Grommet Curtains)</h3><p>ม่านตาไก่เป็นม่านที่มีรูกลมเจาะที่ส่วนบนของผ้า สอดรางม่านผ่านรูเหล่านี้โดยตรง ให้ลุคที่ทันสมัยและสะอาดตา</p><blockquote>💡 <strong>จุดเด่น:</strong> ติดตั้งง่าย เลื่อนเปิด-ปิดสะดวก จีบสม่ำเสมอ</blockquote><h3>2. ม่านจีบ (Pleated Curtains)</h3><p>ม่านจีบเป็นสไตล์คลาสสิก มีหลายแบบ: จีบ 2 นิ้ว จีบ 3 นิ้ว และจีบดินสอ</p><ul><li><strong>จีบ 2 นิ้ว (Pinch Pleat):</strong> ให้ลุคหรูหรา</li><li><strong>จีบ 3 นิ้ว (Triple Pleat):</strong> จีบละเอียด ดูเป็นทางการ</li><li><strong>จีบดินสอ (Pencil Pleat):</strong> จีบเล็กๆ ใช้ได้ทุกสไตล์</li></ul><h3>3. ม่านพับ (Roman Blinds)</h3><p>ม่านพับจะพับเก็บเป็นชั้นๆ เมื่อดึงขึ้น ให้ดูเรียบหรูและประหยัดพื้นที่</p><h3>4. ม่านม้วน (Roller Blinds)</h3><p>ม่านม้วนเป็นม่านที่ม้วนเก็บบนแกนกลม ใช้งานง่าย เหมาะกับออฟฟิศ</p><h3>5. ม่านมู่ลี่ (Venetian Blinds)</h3><p>ประกอบด้วยแผ่นบาง (Slat) เรียงซ้อนกัน ปรับมุมเพื่อควบคุมแสงได้</p>`,downloadUrl:"#",

    content:`<h2>บทที่ 3: การวัดขนาดหน้าต่างและประตู</h2><p>การวัดขนาดที่ถูกต้องเป็นหัวใจของการทำม่านที่สวยงามและพอดี</p><h3>1. เครื่องมือที่จำเป็น</h3><ul><li>ตลับเมตร (อย่างน้อย 5 เมตร)</li><li>สมุดจดและปากกา</li><li>บันได</li><li>ระดับน้ำ (Level)</li></ul><h3>2. วิธีวัดความกว้าง</h3><p>วัดจากขอบนอกของวงกบ แล้วเผื่อด้านละ <strong>15-20 ซม.</strong></p><blockquote>💡 ความกว้างราง = ความกว้างวงกบ + (15~20 ซม. × 2 ข้าง)</blockquote><h3>3. วิธีวัดความยาว</h3><ul><li><strong>ม่านระดับขอบหน้าต่าง:</strong> วัดจากรางถึงขอบล่าง</li><li><strong>ม่านยาวถึงพื้น:</strong> วัดจากรางถึงพื้น หักออก 1-2 ซม.</li><li><strong>ม่านกองพื้น (Puddle):</strong> เพิ่มอีก 5-15 ซม.</li></ul><h3>4. จุดที่ต้องระวัง</h3><ul><li>วัดอย่างน้อย 3 จุด</li><li>ใช้ค่าที่สั้นที่สุดเป็นเกณฑ์</li><li>ตรวจสอบสิ่งกีดขวาง</li></ul>`,downloadUrl:"#",

/* ══════ HOOKS ══════ */
function useToast(){
  const [toasts,setToasts]=useState([]);
  const addToast=useCallback((msg,type="success")=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3000);
  },[]);
  return{toasts,addToast};
}
function Toast({toasts}){
  if(!toasts.length)return null;
  return <div className="toast-container">{toasts.map(t=>(
    <div key={t.id} className={`toast toast-${t.type}`}>{t.type==="success"?"✓":t.type==="error"?"✗":"ℹ"} {t.msg}</div>
  ))}</div>;
}
function Confetti(){
  const c=["#c8a44e","#e8c96a","#2d8a4e","#2980b9","#e74c3c","#8e44ad"];
  return <div>{Array.from({length:30}).map((_,i)=>(
    <div key={i} className="confetti-piece" style={{left:`${Math.random()*100}vw`,top:`${-Math.random()*20}vh`,background:c[i%c.length],animationDelay:`${Math.random()}s`,borderRadius:Math.random()>.5?"50%":"2px",width:Math.random()*8+6,height:Math.random()*8+6}}/>
  ))}</div>;
}

/* ══════ FIREBASE HELPERS ══════ */
async function fbUploadImage(file){
  if(!useFirebase||!storage) return null;
  const ref=storage.ref(`lesson-images/${Date.now()}_${file.name}`);
  const snap=await ref.put(file);
  return await snap.ref.getDownloadURL();
}
async function fbSaveLessons(lessons){
  if(!useFirebase||!db)return;
  const batch=db.batch();
  lessons.forEach(l=>{
    batch.set(db.collection("lessons").doc(l.id),l);
  });
  await batch.commit();
}
async function fbLoadLessons(){
  if(!useFirebase||!db)return null;
  const snap=await db.collection("lessons").orderBy("id").get();
  if(snap.empty)return null;
  return snap.docs.map(d=>d.data());
}
function fbListenLessons(callback){
  if(!useFirebase||!db)return ()=>{};
  return db.collection("lessons").orderBy("id").onSnapshot(snap=>{
    const data=snap.docs.map(d=>d.data());
    if(data.length)callback(data);
  });
}

/* ══════ RICH TEXT EDITOR ══════ */
function RichEditor({initialHtml,onSave,onCancel,lessonTitle,addToast}){
  const editorRef=useRef(null);
  const fileRef=useRef(null);
  const [uploading,setUploading]=useState(false);
  const [uploadProgress,setUploadProgress]=useState(0);
  const [images,setImages]=useState([]);

  useEffect(()=>{
    if(editorRef.current){
      editorRef.current.innerHTML=initialHtml||"";
    }
  },[]);

  const exec=(cmd,val)=>{
    document.execCommand(cmd,false,val||null);
    editorRef.current?.focus();
  };

  const handleImageUpload=async(files)=>{
    for(const file of files){
      if(!file.type.startsWith("image/")){addToast("รองรับเฉพาะไฟล์รูปภาพ","error");continue;}
      if(file.size>5*1024*1024){addToast("ไฟล์ต้องไม่เกิน 5MB","error");continue;}
      
      setUploading(true);setUploadProgress(10);
      
      // If Firebase connected, upload to Storage
      if(useFirebase&&storage){
        try{
          const ref=storage.ref(`lesson-images/${Date.now()}_${file.name}`);
          const task=ref.put(file);
          task.on("state_changed",(snap)=>{
            setUploadProgress(Math.round((snap.bytesTransferred/snap.totalBytes)*100));
          });
          await task;
          const url=await ref.getDownloadURL();
          insertImageToEditor(url,file.name);
          setImages(p=>[...p,{name:file.name,url}]);
          addToast("อัปโหลดรูปสำเร็จ!");
        }catch(e){
          addToast("อัปโหลดล้มเหลว: "+e.message,"error");
        }
      } else {
        // Offline: convert to base64
        const reader=new FileReader();
        reader.onload=(e)=>{
          setUploadProgress(100);
          insertImageToEditor(e.target.result,file.name);
          setImages(p=>[...p,{name:file.name,url:e.target.result}]);
          addToast("เพิ่มรูปสำเร็จ (โหมดออฟไลน์)");
        };
        reader.onprogress=(e)=>{if(e.lengthComputable)setUploadProgress(Math.round((e.loaded/e.total)*100))};
        reader.readAsDataURL(file);
      }
      setUploading(false);setUploadProgress(0);
    }
  };

  const insertImageToEditor=(src,alt)=>{
    const img=`<img src="${src}" alt="${alt||'รูปภาพ'}" style="max-width:100%;border-radius:8px;margin:10px 0;"/>`;
    editorRef.current?.focus();
    document.execCommand("insertHTML",false,img);
  };

  const insertImageUrl=()=>{
    const url=prompt("วาง URL รูปภาพ:");
    if(url){insertImageToEditor(url,"รูปภาพ");addToast("เพิ่มรูปจาก URL สำเร็จ");}
  };

  const handleDrop=(e)=>{
    e.preventDefault();
    e.currentTarget.classList.remove("dragging");
    const files=e.dataTransfer?.files;
    if(files?.length)handleImageUpload(Array.from(files));
  };

  const handlePaste=(e)=>{
    const items=e.clipboardData?.items;
    if(!items)return;
    for(const item of items){
      if(item.type.startsWith("image/")){
        e.preventDefault();
        handleImageUpload([item.getAsFile()]);
        return;
      }
    }
  };

  const insertHighlightBox=()=>{
    exec("insertHTML",'<div style="padding:16px 20px;border-radius:8px;margin:14px 0;background:linear-gradient(135deg,rgba(200,164,78,.08),rgba(200,164,78,.03));border-left:4px solid #c8a44e;">💡 <strong>เคล็ดลับ:</strong> พิมพ์ข้อความที่นี่</div><p></p>');
  };
  const insertInfoBox=()=>{
    exec("insertHTML",'<div style="padding:16px 20px;border-radius:8px;margin:14px 0;background:rgba(41,128,185,.06);border-left:4px solid #2980b9;">📌 <strong>หมายเหตุ:</strong> พิมพ์ข้อความที่นี่</div><p></p>');
  };
  const insertTable=()=>{
    exec("insertHTML",'<table><thead><tr><th>หัวข้อ 1</th><th>หัวข้อ 2</th><th>หัวข้อ 3</th></tr></thead><tbody><tr><td>ข้อมูล</td><td>ข้อมูล</td><td>ข้อมูล</td></tr><tr><td>ข้อมูล</td><td>ข้อมูล</td><td>ข้อมูล</td></tr></tbody></table><p></p>');
  };

  const handleSave=()=>{
    const html=editorRef.current?.innerHTML||"";
    onSave(html);
  };

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <h2 className="font-display" style={{color:"var(--navy)",fontSize:"1.3rem"}}>✏️ แก้ไขเนื้อหา: {lessonTitle}</h2>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-outline btn-sm" onClick={onCancel}>ยกเลิก</button>
          <button className="btn btn-gold" onClick={handleSave}>💾 บันทึกเนื้อหา</button>
        </div>
      </div>

      {/* Toolbar */}
      <div className="editor-toolbar">
        <button onClick={()=>exec("bold")} title="ตัวหนา"><b>B</b></button>
        <button onClick={()=>exec("italic")} title="ตัวเอียง"><i>I</i></button>
        <button onClick={()=>exec("underline")} title="ขีดเส้นใต้"><u>U</u></button>
        <button onClick={()=>exec("strikeThrough")} title="ขีดทับ"><s>S</s></button>
        <div className="sep"/>
        <button onClick={()=>exec("formatBlock","h2")} title="หัวข้อใหญ่">H2</button>
        <button onClick={()=>exec("formatBlock","h3")} title="หัวข้อรอง">H3</button>
        <button onClick={()=>exec("formatBlock","p")} title="ย่อหน้า">¶</button>
        <div className="sep"/>
        <button onClick={()=>exec("insertUnorderedList")} title="รายการจุด">• List</button>
        <button onClick={()=>exec("insertOrderedList")} title="รายการเลข">1. List</button>
        <button onClick={()=>exec("formatBlock","blockquote")} title="Quote">❝ Quote</button>
        <div className="sep"/>
        <button onClick={()=>exec("justifyLeft")} title="ชิดซ้าย">⫷</button>
        <button onClick={()=>exec("justifyCenter")} title="กึ่งกลาง">⫿</button>
        <button onClick={()=>exec("justifyRight")} title="ชิดขวา">⫸</button>
        <div className="sep"/>
        <button onClick={insertHighlightBox} title="กล่องเคล็ดลับ" style={{background:"rgba(200,164,78,.15)"}}>💡 Tip</button>
        <button onClick={insertInfoBox} title="กล่องข้อมูล" style={{background:"rgba(41,128,185,.1)"}}>📌 Info</button>
        <button onClick={insertTable} title="ตาราง">📊 Table</button>
        <div className="sep"/>
        <button onClick={()=>fileRef.current?.click()} title="อัปโหลดรูป" style={{background:"rgba(45,138,78,.1)",color:"var(--success)"}}>📷 รูปภาพ</button>
        <button onClick={insertImageUrl} title="แทรกรูปจาก URL">🔗 URL รูป</button>
        <div className="sep"/>
        <button onClick={()=>exec("removeFormat")} title="ลบ Format">🧹</button>
        <button onClick={()=>{if(confirm("ลบเนื้อหาทั้งหมด?")){editorRef.current.innerHTML="";addToast("ล้างเนื้อหาแล้ว","info")}}} title="ล้างทั้งหมด" style={{color:"var(--danger)"}}>🗑️</button>
      </div>

      {/* Hidden file input */}
      <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={e=>handleImageUpload(Array.from(e.target.files||[]))}/>

      {/* Upload progress */}
      {uploading && (
        <div style={{padding:"8px 12px",background:"var(--cream)",display:"flex",alignItems:"center",gap:10}}>
          <span className="spinner"/><span style={{fontSize:".85rem"}}>กำลังอัปโหลด...</span>
          <div className="upload-progress" style={{flex:1}}><div className="upload-progress-bar" style={{width:`${uploadProgress}%`}}/></div>
          <span style={{fontSize:".8rem",fontWeight:600}}>{uploadProgress}%</span>
        </div>
      )}

      {/* Editor area */}
      <div ref={editorRef} className="editor-area" contentEditable="true" suppressContentEditableWarning
        onDrop={handleDrop}
        onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add("dragging")}}
        onDragLeave={e=>e.currentTarget.classList.remove("dragging")}
        onPaste={handlePaste}
      />

      {/* Image upload zone */}
      <div className="img-upload-zone"
        onClick={()=>fileRef.current?.click()}
        onDrop={handleDrop}
        onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add("dragging")}}
        onDragLeave={e=>e.currentTarget.classList.remove("dragging")}
      >
        <div style={{fontSize:"2rem",marginBottom:8}}>📷</div>
        <p style={{fontWeight:600,color:"var(--navy)"}}>คลิกหรือลากรูปภาพมาวางที่นี่</p>
        <p style={{fontSize:".82rem",color:"var(--text-light)"}}>รองรับ JPG, PNG, GIF, WebP (ไม่เกิน 5MB) • วาง (Paste) รูปในพื้นที่แก้ไขได้เลย</p>
        {useFirebase && <p style={{fontSize:".75rem",color:"var(--success)",marginTop:4}}>✓ เชื่อมต่อ Firebase Storage แล้ว — รูปจะถูกอัปโหลดขึ้น Cloud</p>}
        {!useFirebase && <p style={{fontSize:".75rem",color:"var(--gold-dim)",marginTop:4}}>⚠ โหมดออฟไลน์ — รูปจะถูกฝังเป็น Base64 ในเนื้อหา</p>}
      </div>

      {/* Uploaded images gallery */}
      {images.length>0 && (
        <div style={{marginTop:12}}>
          <p className="label">รูปที่อัปโหลดแล้ว (คลิกเพื่อแทรกอีกครั้ง)</p>
          <div className="img-preview-grid">
            {images.map((img,i)=>(
              <div key={i} className="img-preview-item" onClick={()=>insertImageToEditor(img.url,img.name)} style={{cursor:"pointer"}}>
                <img src={img.url} alt={img.name}/>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════ LESSON MANAGEMENT (Admin/Instructor) ══════ */
function LessonManagement({lessons,setLessons,addToast,user}){
  const [editingLesson,setEditingLesson]=useState(null);
  const [editMode,setEditMode]=useState(null); // "content"|"meta"|null
  const [metaForm,setMetaForm]=useState({});

  const canEdit=user.role==="admin"||user.role==="instructor";
  if(!canEdit) return null;

  const handleSaveContent=async(lessonId,html)=>{
    const updated=lessons.map(l=>l.id===lessonId?{...l,content:html}:l);
    setLessons(updated);
    if(useFirebase){
      try{
        await db.collection("lessons").doc(lessonId).update({content:html});
        addToast("บันทึกเนื้อหาลง Firebase สำเร็จ! 🔥");
      }catch(e){addToast("บันทึกลง Firebase ล้มเหลว: "+e.message,"error")}
    } else {
      addToast("บันทึกเนื้อหาสำเร็จ (ออฟไลน์)");
    }
    setEditingLesson(null);setEditMode(null);
  };

  const handleSaveMeta=async()=>{
    const updated=lessons.map(l=>l.id===metaForm.id?{...l,...metaForm}:l);
    setLessons(updated);
    if(useFirebase){
      try{
        await db.collection("lessons").doc(metaForm.id).update({title:metaForm.title,description:metaForm.description,icon:metaForm.icon,downloadUrl:metaForm.downloadUrl});
        addToast("บันทึกข้อมูลบทเรียนสำเร็จ! 🔥");
      }catch(e){addToast("บันทึกลง Firebase ล้มเหลว","error")}
    } else {
      addToast("บันทึกข้อมูลบทเรียนสำเร็จ (ออฟไลน์)");
    }
    setEditMode(null);
  };

  const addNewLesson=async()=>{
    const newId="L"+(lessons.length+1);
    const newLesson={id:newId,title:"บทเรียนใหม่",icon:"📖",color:LESSON_COLORS[lessons.length%5],
      description:"คำอธิบายบทเรียน...",content:"<h2>บทเรียนใหม่</h2><p>เพิ่มเนื้อหาที่นี่...</p>",
      downloadUrl:"#",quizPool:[]};
    const updated=[...lessons,newLesson];
    setLessons(updated);
    if(useFirebase){
      try{await db.collection("lessons").doc(newId).set(newLesson);addToast("สร้างบทเรียนใหม่สำเร็จ! 🔥")}
      catch(e){addToast("สร้างลง Firebase ล้มเหลว","error")}
    } else addToast("สร้างบทเรียนใหม่สำเร็จ (ออฟไลน์)");
  };

  const deleteLesson=async(id)=>{
    if(!confirm("ต้องการลบบทเรียนนี้?"))return;
    const updated=lessons.filter(l=>l.id!==id);
    setLessons(updated);
    if(useFirebase){
      try{await db.collection("lessons").doc(id).delete();addToast("ลบบทเรียนสำเร็จ","info")}
      catch(e){addToast("ลบจาก Firebase ล้มเหลว","error")}
    } else addToast("ลบบทเรียนสำเร็จ (ออฟไลน์)","info");
  };

  // Content editor full-screen
  if(editMode==="content"&&editingLesson){
    return(
      <div className="container fade-in">
        <RichEditor
          initialHtml={editingLesson.content}
          lessonTitle={editingLesson.title}
          onSave={(html)=>handleSaveContent(editingLesson.id,html)}
          onCancel={()=>{setEditMode(null);setEditingLesson(null)}}
          addToast={addToast}
        />
      </div>
    );
  }

  // Meta editor modal
  if(editMode==="meta"){
    return(
      <div className="container fade-in">
        <button className="btn btn-outline btn-sm" onClick={()=>setEditMode(null)} style={{marginBottom:20}}>← กลับ</button>
        <div className="card" style={{padding:32,maxWidth:600}}>
          <h3 style={{color:"var(--navy)",marginBottom:20}}>แก้ไขข้อมูลบทเรียน</h3>
          <div className="form-group"><label className="label">ชื่อบทเรียน</label><input className="input" value={metaForm.title||""} onChange={e=>setMetaForm(p=>({...p,title:e.target.value}))}/></div>
          <div className="form-group"><label className="label">ไอคอน (Emoji)</label><input className="input" value={metaForm.icon||""} onChange={e=>setMetaForm(p=>({...p,icon:e.target.value}))}/></div>
          <div className="form-group"><label className="label">คำอธิบาย</label><textarea className="input" value={metaForm.description||""} onChange={e=>setMetaForm(p=>({...p,description:e.target.value}))}/></div>

function QuizPage({lesson,lessonIndex,onBack,onPass,addToast}){
  const[questions,setQuestions]=useState([]);const[current,setCurrent]=useState(0);const[selected,setSelected]=useState(null);const[answered,setAnswered]=useState(false);const[results,setResults]=useState([]);const[done,setDone]=useState(false);
  const initQuiz=()=>{
    const pool=[...lesson.quizPool];const shuffled=pool.sort(()=>Math.random()-.5).slice(0,10);
    const prepared=shuffled.map(q=>{const optPairs=q.opts.map((o,i)=>({text:o,origIdx:i}));optPairs.sort(()=>Math.random()-.5);const newAns=optPairs.findIndex(p=>p.origIdx===q.ans);return{q:q.q,opts:optPairs.map(p=>p.text),ans:newAns}});
    setQuestions(prepared);setCurrent(0);setSelected(null);setAnswered(false);setResults([]);setDone(false);
  };
  useEffect(initQuiz,[lesson]);
  if(!questions.length)return null;
  const handleConfirm=()=>{if(selected===null)return;setAnswered(true);setResults(p=>[...p,selected===questions[current].ans])};
  const handleNext=()=>{if(current<questions.length-1){setCurrent(c=>c+1);setSelected(null);setAnswered(false)}else setDone(true)};
  const score=results.filter(Boolean).length;const perfect=score===10;

  if(done)return(
    <div className="container fade-in"><div className="card" style={{padding:40}}><div className="quiz-result">
      {perfect&&<Confetti/>}<div style={{fontSize:"4rem",marginBottom:16}}>{perfect?"🎉":"😢"}</div>
      <div className={`quiz-score ${perfect?"perfect":"fail"}`}>{score}/10</div>
      <p style={{fontSize:"1.2rem",margin:"16px 0",color:perfect?"var(--success)":"var(--danger)"}}>{perfect?"ยอดเยี่ยม! คุณผ่านบทนี้แล้ว!":"ต้องได้ 10/10 ถึงจะผ่าน ลองอีกครั้ง!"}</p>
      <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
        {perfect?<button className="btn btn-gold btn-lg" onClick={()=>{onPass(lesson.id);addToast("ปลดล็อกบทถัดไปแล้ว! 🎉")}}>ดำเนินการต่อ →</button>
          :<button className="btn btn-primary btn-lg" onClick={initQuiz}>ลองอีกครั้ง ↺</button>}
        <button className="btn btn-outline" onClick={onBack}>กลับหน้าบทเรียน</button>
      </div>
    </div></div></div>
  );

  const q=questions[current];
  return(
    <div className="container fade-in"><button className="btn btn-outline btn-sm" onClick={onBack} style={{marginBottom:20}}>← กลับ</button>
      <div className="card" style={{padding:"32px 36px"}}><div className="quiz-container">
        <div style={{textAlign:"center",marginBottom:24}}><h2 className="font-display" style={{color:"var(--navy)"}}>แบบทดสอบ: {lesson.title}</h2>
          <div className="quiz-progress">{questions.map((_,i)=>(<div key={i} className={`quiz-dot ${i===current?"current":i<results.length?(results[i]?"correct":"wrong"):"pending"}`}>{i+1}</div>))}</div>
        </div>
        <div style={{fontSize:".82rem",color:"var(--text-light)",marginBottom:8}}>ข้อ {current+1}/{questions.length}</div>
        <div className="quiz-question">{q.q}</div>
        {q.opts.map((o,i)=>{let cls="quiz-option";if(answered){if(i===q.ans)cls+=" correct-answer";else if(i===selected)cls+=" wrong-answer"}else if(i===selected)cls+=" selected";return<button key={i} className={cls} onClick={()=>!answered&&setSelected(i)}>{o}</button>})}
        <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:16}}>
          {!answered?<button className="btn btn-primary" disabled={selected===null} onClick={handleConfirm}>ยืนยันคำตอบ</button>
            :<button className="btn btn-gold" onClick={handleNext}>{current<questions.length-1?"ข้อถัดไป →":"ดูผลลัพธ์"}</button>}
        </div>
      </div></div>
    </div>
  );
}

function Calculator(){
  const[tw,sTw]=useState(300);const[h,sH]=useState(260);const[pt,sPt]=useState("2.5");const[fw,sFw]=useState(140);
  const[pm,sPm]=useState(450);const[sc,sSc]=useState(300);const[tc,sTc]=useState(250);const[ic,sIc]=useState(800);const[ha,sHa]=useState(25);
  const tfW=tw*parseFloat(pt);const pan=Math.ceil(tfW/fw);const lpp=h+ha;const tf=(pan*lpp/100).toFixed(1);
  const fC=(tf*pm).toFixed(0);const tS=(pan*sc).toFixed(0);const tT=((tw/100)*tc).toFixed(0);const gt=(parseFloat(fC)+parseFloat(tS)+parseFloat(tT)+ic).toFixed(0);
  return(
    <div className="container fade-in"><div className="page-header"><h1 className="page-title font-display">🧮 เครื่องคำนวณผ้าม่าน</h1><p className="page-sub">คำนวณปริมาณผ้าและราคา</p></div>
      <div className="card" style={{padding:32}}><div className="calc-wrap">
        <div className="calc-grid">
          <div className="form-group"><label className="label">ความกว้างราง (ซม.)</label><input className="input" type="number" value={tw} onChange={e=>sTw(+e.target.value)}/></div>
          <div className="form-group"><label className="label">ความสูงม่าน (ซม.)</label><input className="input" type="number" value={h} onChange={e=>sH(+e.target.value)}/></div>
          <div className="form-group"><label className="label">อัตราจีบ</label><select className="input" value={pt} onChange={e=>sPt(e.target.value)}><option value="1.5">1.5× (ตาไก่)</option><option value="2">2× (จีบดินสอ)</option><option value="2.5">2.5× (จีบ 2 นิ้ว)</option><option value="3">3× (จีบ 3 นิ้ว)</option></select></div>
          <div className="form-group"><label className="label">หน้ากว้างผ้า (ซม.)</label><select className="input" value={fw} onChange={e=>sFw(+e.target.value)}><option value="140">140</option><option value="280">280</option><option value="300">300</option></select></div>
          <div className="form-group"><label className="label">ราคาผ้า (บาท/ม.)</label><input className="input" type="number" value={pm} onChange={e=>sPm(+e.target.value)}/></div>
          <div className="form-group"><label className="label">ค่าเย็บ (บาท/หน้า)</label><input className="input" type="number" value={sc} onChange={e=>sSc(+e.target.value)}/></div>
          <div className="form-group"><label className="label">ค่าราง (บาท/ม.)</label><input className="input" type="number" value={tc} onChange={e=>sTc(+e.target.value)}/></div>
          <div className="form-group"><label className="label">ค่าติดตั้ง (บาท)</label><input className="input" type="number" value={ic} onChange={e=>sIc(+e.target.value)}/></div>
        </div>
        <div className="calc-result"><h3 style={{color:"var(--gold)",marginBottom:16,fontFamily:"'Playfair Display',serif"}}>ผลการคำนวณ</h3>
          <div className="calc-result-row"><span>ความกว้างผ้ารวม</span><span>{tfW.toFixed(0)} ซม.</span></div>
          <div className="calc-result-row"><span>จำนวนหน้าผ้า</span><span>{pan} หน้า</span></div>
          <div className="calc-result-row"><span>ความยาวต่อหน้า</span><span>{lpp} ซม.</span></div>
          <div className="calc-result-row"><span>ปริมาณผ้ารวม</span><span>{tf} เมตร</span></div>
          <div style={{borderTop:"1px solid rgba(255,255,255,.2)",margin:"8px 0"}}/>
          <div className="calc-result-row"><span>ค่าผ้า</span><span>฿{parseInt(fC).toLocaleString()}</span></div>
          <div className="calc-result-row"><span>ค่าตัดเย็บ</span><span>฿{parseInt(tS).toLocaleString()}</span></div>
          <div className="calc-result-row"><span>ค่าราง</span><span>฿{parseInt(tT).toLocaleString()}</span></div>
          <div className="calc-result-row"><span>ค่าติดตั้ง</span><span>฿{ic.toLocaleString()}</span></div>
          <div className="calc-result-row"><span style={{color:"var(--gold)"}}>💰 รวม</span><span style={{color:"var(--gold)",fontSize:"1.3rem"}}>฿{parseInt(gt).toLocaleString()}</span></div>
        </div>
      </div></div>
    </div>
  );
}

function GamePage(){
  const[mode,setMode]=useState(null);
  if(!mode)return(<div className="container fade-in"><div className="page-header"><h1 className="page-title font-display">🎮 เกมเสริมทักษะ</h1></div><div className="grid-2">
    <div className="card" style={{padding:32,textAlign:"center",cursor:"pointer"}} onClick={()=>setMode("match")}><div style={{fontSize:"3.5rem",marginBottom:16}}>🃏</div><h3 style={{color:"var(--navy)"}}>เกมจับคู่</h3><p style={{fontSize:".88rem",color:"var(--text-light)"}}>จับคู่ชื่อผ้าม่านไทย-อังกฤษ</p><button className="btn btn-gold" style={{marginTop:16}}>เล่นเลย</button></div>
    <div className="card" style={{padding:32,textAlign:"center",cursor:"pointer"}} onClick={()=>setMode("speed")}><div style={{fontSize:"3.5rem",marginBottom:16}}>⚡</div><h3 style={{color:"var(--navy)"}}>คำนวณแข่งเวลา</h3><p style={{fontSize:".88rem",color:"var(--text-light)"}}>ตอบโจทย์คำนวณให้เร็วที่สุด</p><button className="btn btn-gold" style={{marginTop:16}}>เล่นเลย</button></div>
  </div></div>);
  if(mode==="match")return<MatchGame onBack={()=>setMode(null)}/>;
  return<SpeedGame onBack={()=>setMode(null)}/>;
}

function MatchGame({onBack}){
  const[cards,setCards]=useState([]);const[flipped,setFlipped]=useState([]);const[matched,setMatched]=useState([]);const[moves,setMoves]=useState(0);const[won,setWon]=useState(false);const lock=useRef(false);
  const init=()=>{const pairs=GAME_PAIRS.slice(0,6);const d=[];pairs.forEach(p=>{d.push({uid:p.id+"a",pairId:p.id,text:p.text,type:"th"});d.push({uid:p.id+"b",pairId:p.id,text:p.match,type:"en"})});d.sort(()=>Math.random()-.5);setCards(d);setFlipped([]);setMatched([]);setMoves(0);setWon(false)};
  useEffect(init,[]);
  const flip=i=>{if(lock.current)return;if(flipped.includes(i)||matched.includes(cards[i].pairId))return;const nf=[...flipped,i];setFlipped(nf);
    if(nf.length===2){setMoves(m=>m+1);lock.current=true;const[a,b]=nf;
      if(cards[a].pairId===cards[b].pairId){setTimeout(()=>{const nm=[...matched,cards[a].pairId];setMatched(nm);setFlipped([]);lock.current=false;if(nm.length===6)setWon(true)},600)}
      else{setTimeout(()=>{setFlipped([]);lock.current=false},1000)}}};
  return(
    <div className="container fade-in"><button className="btn btn-outline btn-sm" onClick={onBack} style={{marginBottom:20}}>← กลับ</button>
      <div className="card" style={{padding:32}}><div style={{textAlign:"center",marginBottom:20}}><h2 className="font-display" style={{color:"var(--navy)"}}>🃏 เกมจับคู่</h2><p style={{color:"var(--text-light)",fontSize:".88rem"}}>เปิดแล้ว: {moves} ครั้ง</p></div>
        {won&&<Confetti/>}
        {won?(<div style={{textAlign:"center",padding:40}}><div style={{fontSize:"4rem",marginBottom:16}}>🎉</div><h3 style={{color:"var(--gold)",fontSize:"1.6rem",fontFamily:"'Playfair Display',serif"}}>ยินดีด้วย!</h3><p style={{color:"var(--text-light)",margin:"12px 0"}}>{moves} ครั้ง</p><button className="btn btn-gold" onClick={init}>เล่นอีกครั้ง</button></div>
        ):(<div className="game-board" style={{gridTemplateColumns:"repeat(4,1fr)"}}>{cards.map((c,i)=>{const f=flipped.includes(i);const m=matched.includes(c.pairId);
          return(<div key={c.uid} className={`game-card-cell ${f?"flipped":""} ${m?"matched":""}`} onClick={()=>flip(i)}><div className="game-card-inner"><div className="game-card-front">🪟</div><div className="game-card-back"><span style={{fontSize:c.type==="th"?".85rem":".75rem"}}>{c.text}</span><span style={{fontSize:".6rem",color:"var(--text-light)"}}>{c.type==="th"?"🇹🇭":"🇬🇧"}</span></div></div></div>)
        })}</div>)}
      </div>
    </div>
  );
}

function SpeedGame({onBack}){
  const[qi,setQi]=useState(0);const[ans,setAns]=useState("");const[score,setScore]=useState(0);const[time,setTime]=useState(60);const[over,setOver]=useState(false);const[fb,setFb]=useState(null);const t=useRef();
  const qs=[{q:"ราง 2 ม. ×2.5 → ความกว้างผ้า (ซม.)?",a:500},{q:"ราง 3 ม. ×2 → ความกว้างผ้า?",a:600},{q:"700÷140 = กี่หน้า?",a:5},{q:"500÷140 = กี่หน้า? (ปัดขึ้น)",a:4},{q:"สูง260+พับ25=?",a:285},{q:"6หน้า×285÷100=?(×10)",a:171},{q:"ผ้า17ม.×450=?",a:7650},{q:"วงกบ150+เผื่อ2ข้าง(20)=?",a:190},{q:"ราง4ม.×1.5=?",a:600},{q:"5หน้า×300=?",a:1500}];
  const startTimer=()=>{t.current=setInterval(()=>{setTime(v=>{if(v<=1){clearInterval(t.current);setOver(true);return 0}return v-1})},1000)};
  useEffect(()=>{startTimer();return()=>clearInterval(t.current)},[]);
  const submit=e=>{e.preventDefault();if(over)return;const correct=parseInt(ans)===qs[qi].a;if(correct)setScore(s=>s+1);setFb(correct?"correct":"wrong");
    setTimeout(()=>{setFb(null);setAns("");if(qi<qs.length-1)setQi(i=>i+1);else{clearInterval(t.current);setOver(true)}},600)};
  const restart=()=>{setQi(0);setScore(0);setTime(60);setOver(false);setAns("");startTimer()};
  if(over)return(<div className="container fade-in"><button className="btn btn-outline btn-sm" onClick={()=>{clearInterval(t.current);onBack()}} style={{marginBottom:20}}>← กลับ</button><div className="card" style={{padding:40,textAlign:"center"}}><div style={{fontSize:"4rem",marginBottom:16}}>⏱️</div><h2 className="font-display" style={{color:"var(--navy)"}}>จบเกม!</h2><div style={{fontSize:"3rem",fontWeight:800,color:"var(--gold)",margin:"16px 0"}}>{score}/{qs.length}</div><button className="btn btn-gold" style={{marginTop:20}} onClick={restart}>เล่นอีกครั้ง</button></div></div>);
  return(<div className="container fade-in"><button className="btn btn-outline btn-sm" onClick={()=>{clearInterval(t.current);onBack()}} style={{marginBottom:20}}>← กลับ</button><div className="card" style={{padding:32}}>
    <div style={{textAlign:"center",marginBottom:24}}><h2 className="font-display" style={{color:"var(--navy)"}}>⚡ คำนวณแข่งเวลา</h2><div className="game-timer" style={{color:time<=10?"var(--danger)":"var(--navy)",marginTop:8}}>⏱️ {time}s</div><p style={{color:"var(--text-light)",fontSize:".85rem",marginTop:4}}>คะแนน: {score} | ข้อ {qi+1}/{qs.length}</p></div>
    <div style={{maxWidth:500,margin:"0 auto"}}><div className="quiz-question" style={{background:fb==="correct"?"rgba(45,138,78,.1)":fb==="wrong"?"rgba(192,57,43,.1)":"transparent",padding:16,borderRadius:"var(--radius-sm)",transition:"background .3s"}}>{qs[qi].q}</div>
      <form onSubmit={submit} style={{display:"flex",gap:10,marginTop:16}}><input className="input" type="number" placeholder="คำตอบ..." value={ans} onChange={e=>setAns(e.target.value)} autoFocus style={{fontSize:"1.1rem",flex:1}}/><button type="submit" className="btn btn-gold">ตอบ</button></form>
    </div></div></div>);
}

function UserManagement({users,setUsers,addToast}){
  const[modal,setModal]=useState(null);const[form,setForm]=useState({name:"",email:"",role:"student",password:"1234"});
  const openAdd=()=>{setForm({name:"",email:"",role:"student",password:"1234"});setModal("add")};
  const openEdit=u=>{setForm({...u});setModal("edit")};
  const save=()=>{if(!form.name||!form.email){addToast("กรอกข้อมูลให้ครบ","error");return}
    if(modal==="add"){setUsers(p=>[...p,{...form,id:"u"+Date.now()}]);addToast("เพิ่มผู้ใช้สำเร็จ")}
    else{setUsers(p=>p.map(u=>u.id===form.id?{...form}:u));addToast("แก้ไขสำเร็จ")}setModal(null)};
  const del=id=>{if(confirm("ลบผู้ใช้นี้?")){setUsers(p=>p.filter(u=>u.id!==id));addToast("ลบแล้ว","info")}};
  return(
    <div className="container fade-in"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:24}}><div><h1 className="page-title font-display">👥 จัดการผู้ใช้</h1></div><button className="btn btn-gold" onClick={openAdd}>+ เพิ่มผู้ใช้</button></div>
      <div className="card" style={{overflow:"auto"}}><table className="data-table"><thead><tr><th>ชื่อ</th><th>อีเมล</th><th>บทบาท</th><th>จัดการ</th></tr></thead><tbody>{users.map(u=>(<tr key={u.id}><td style={{fontWeight:600}}>{u.name}</td><td>{u.email}</td><td><span className={`badge ${u.role==="admin"?"badge-danger":u.role==="instructor"?"badge-info":"badge-success"}`}>{u.role==="admin"?"ผู้ดูแล":u.role==="instructor"?"ผู้สอน":"ผู้เรียน"}</span></td><td style={{display:"flex",gap:6}}><button className="btn btn-sm btn-outline" onClick={()=>openEdit(u)}>✏️</button><button className="btn btn-sm btn-danger" onClick={()=>del(u.id)}>🗑️</button></td></tr>))}</tbody></table></div>
      {modal&&(<div className="modal-overlay" onClick={()=>setModal(null)}><div className="modal-content" onClick={e=>e.stopPropagation()}><div className="modal-header"><h3>{modal==="add"?"เพิ่มผู้ใช้":"แก้ไขผู้ใช้"}</h3><button className="modal-close" onClick={()=>setModal(null)}>✕</button></div>
        <div className="modal-body"><div className="form-group"><label className="label">ชื่อ</label><input className="input" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))}/></div><div className="form-group"><label className="label">อีเมล</label><input className="input" type="email" value={form.email} onChange={e=>setForm(p=>({...p,email:e.target.value}))}/></div><div className="form-group"><label className="label">รหัสผ่าน</label><input className="input" value={form.password} onChange={e=>setForm(p=>({...p,password:e.target.value}))}/></div>
          <div className="form-group"><label className="label">บทบาท</label><select className="input" value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))}><option value="student">ผู้เรียน</option><option value="instructor">ผู้สอน</option><option value="admin">ผู้ดูแล</option></select></div></div>
        <div className="modal-footer"><button className="btn btn-outline" onClick={()=>setModal(null)}>ยกเลิก</button><button className="btn btn-gold" onClick={save}>💾 บันทึก</button></div></div></div>)}
    </div>
  );
}

function QuizManagement({lessons,setLessons,addToast}){
  const[sl,setSl]=useState(lessons[0]?.id||"");const[modal,setModal]=useState(null);const[eIdx,setEIdx]=useState(null);const[form,setForm]=useState({q:"",opts:["","","",""],ans:0});
  const lesson=lessons.find(l=>l.id===sl);const pool=lesson?.quizPool||[];
  const openAdd=()=>{setForm({q:"",opts:["","","",""],ans:0});setEIdx(null);setModal("add")};
  const openEdit=(q,i)=>{setForm({q:q.q,opts:[...q.opts],ans:q.ans});setEIdx(i);setModal("edit")};
  const save=async()=>{if(!form.q||form.opts.some(o=>!o)){addToast("กรอกข้อมูลให้ครบ","error");return}
    setLessons(prev=>prev.map(l=>{if(l.id!==sl)return l;const np=[...l.quizPool];if(modal==="add")np.push({...form});else np[eIdx]={...form};return{...l,quizPool:np}}));
    if(useFirebase){const l=lessons.find(x=>x.id===sl);const np=[...(l?.quizPool||[])];if(modal==="add")np.push({...form});else np[eIdx]={...form};
      try{await db.collection("lessons").doc(sl).update({quizPool:np});addToast("บันทึก Quiz ลง Firebase สำเร็จ! 🔥")}catch(e){addToast("บันทึกล้มเหลว","error")}}
    else addToast(modal==="add"?"เพิ่มสำเร็จ":"แก้ไขสำเร็จ");setModal(null)};
  const del=async(i)=>{if(!confirm("ลบข้อสอบนี้?"))return;setLessons(prev=>prev.map(l=>{if(l.id!==sl)return l;return{...l,quizPool:l.quizPool.filter((_,j)=>j!==i)}}));
    if(useFirebase){const l=lessons.find(x=>x.id===sl);const np=(l?.quizPool||[]).filter((_,j)=>j!==i);try{await db.collection("lessons").doc(sl).update({quizPool:np})}catch(e){}}addToast("ลบแล้ว","info")};
  return(
    <div className="container fade-in"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:24}}><div><h1 className="page-title font-display">📝 จัดการ Quiz</h1></div><button className="btn btn-gold" onClick={openAdd}>+ เพิ่มข้อสอบ</button></div>
      <div className="form-group" style={{maxWidth:300,marginBottom:20}}><label className="label">เลือกบทเรียน</label><select className="input" value={sl} onChange={e=>setSl(e.target.value)}>{lessons.map((l,i)=><option key={l.id} value={l.id}>บทที่ {i+1}: {l.title}</option>)}</select></div>
      <div className="card" style={{overflow:"auto"}}><table className="data-table"><thead><tr><th>#</th><th>คำถาม</th><th>คำตอบ</th><th>จัดการ</th></tr></thead><tbody>{pool.map((q,i)=>(<tr key={i}><td>{i+1}</td><td style={{maxWidth:300}}>{q.q}</td><td><span className="badge badge-success">{q.opts[q.ans]}</span></td><td style={{display:"flex",gap:6}}><button className="btn btn-sm btn-outline" onClick={()=>openEdit(q,i)}>✏️</button><button className="btn btn-sm btn-danger" onClick={()=>del(i)}>🗑️</button></td></tr>))}</tbody></table>
        <div style={{padding:16,fontSize:".85rem",color:"var(--text-light)"}}>รวม {pool.length} ข้อ (สุ่ม 10 ข้อ/ครั้ง)</div></div>
      {modal&&(<div className="modal-overlay" onClick={()=>setModal(null)}><div className="modal-content" onClick={e=>e.stopPropagation()}><div className="modal-header"><h3>{modal==="add"?"เพิ่มข้อสอบ":"แก้ไขข้อสอบ"}</h3><button className="modal-close" onClick={()=>setModal(null)}>✕</button></div>
        <div className="modal-body"><div className="form-group"><label className="label">คำถาม</label><textarea className="input" value={form.q} onChange={e=>setForm(p=>({...p,q:e.target.value}))}/></div>
          {form.opts.map((o,i)=>(<div className="form-group" key={i}><label className="label">ตัวเลือก {i+1} {i===form.ans&&"✅"}</label><div style={{display:"flex",gap:8}}><input className="input" value={o} onChange={e=>{const n=[...form.opts];n[i]=e.target.value;setForm(p=>({...p,opts:n}))}}/><button type="button" className={`btn btn-sm ${i===form.ans?"btn-gold":"btn-outline"}`} onClick={()=>setForm(p=>({...p,ans:i}))}>{i===form.ans?"✓":"ตั้ง"}</button></div></div>))}
        </div><div className="modal-footer"><button className="btn btn-outline" onClick={()=>setModal(null)}>ยกเลิก</button><button className="btn btn-gold" onClick={save}>💾 บันทึก</button></div></div></div>)}
    </div>
  );
}

/* ══════ MAIN APP ══════ */
function App(){
  const[user,setUser]=useState(null);const[page,setPage]=useState("dashboard");const[users,setUsers]=useState(DEFAULT_USERS);
  const[lessons,setLessons]=useState(DEFAULT_LESSONS);const[progress,setProgress]=useState({});
  const[selLesson,setSelLesson]=useState(null);const[lessonIdx,setLessonIdx]=useState(0);const[viewMode,setViewMode]=useState("list");
  const{toasts,addToast}=useToast();

  // Firebase real-time listener
  useEffect(()=>{
    if(!useFirebase)return;
    // Load initial lessons from Firestore
    fbLoadLessons().then(data=>{if(data&&data.length)setLessons(data)});
    // Real-time listener
    const unsub=fbListenLessons(data=>{setLessons(data)});
    return unsub;
  },[]);

  const handleLogin=u=>{setUser(u);setPage("dashboard");addToast(`ยินดีต้อนรับ ${u.name}`)};
  const handleLogout=()=>{setUser(null);setPage("dashboard");setViewMode("list");setSelLesson(null)};
  const handleSelectLesson=(l,i)=>{setSelLesson(l);setLessonIdx(i);setViewMode("content");setPage("lessons")};
  const handlePassQuiz=id=>{setProgress(p=>({...p,[id]:true}));setViewMode("list")};

  if(!user)return<><LoginPage onLogin={handleLogin} users={users}/><Toast toasts={toasts}/></>;

  // Keep selLesson in sync with lessons
  const currentLesson=selLesson?lessons.find(l=>l.id===selLesson.id)||selLesson:null;

  let content;
  if(page==="dashboard")content=<Dashboard user={user} lessons={lessons} progress={progress} users={users}/>;
  else if(page==="lessons"){
    if(viewMode==="quiz"&&currentLesson)content=<QuizPage lesson={currentLesson} lessonIndex={lessonIdx} onBack={()=>setViewMode("content")} onPass={handlePassQuiz} addToast={addToast}/>;
    else if(viewMode==="content"&&currentLesson)content=<LessonView lesson={currentLesson} lessonIndex={lessonIdx} onBack={()=>{setViewMode("list");setSelLesson(null)}} onStartQuiz={()=>setViewMode("quiz")}/>;
    else content=<LessonsList lessons={lessons} progress={progress} user={user} onSelectLesson={handleSelectLesson}/>;
  }
  else if(page==="lesson-manage")content=<LessonManagement lessons={lessons} setLessons={setLessons} addToast={addToast} user={user}/>;
  else if(page==="calculator")content=<Calculator/>;
  else if(page==="game")content=<GamePage/>;
  else if(page==="users"&&user.role==="admin")content=<UserManagement users={users} setUsers={setUsers} addToast={addToast}/>;
  else if(page==="quiz-manage"&&(user.role==="admin"||user.role==="instructor"))content=<QuizManagement lessons={lessons} setLessons={setLessons} addToast={addToast}/>;
  else content=<Dashboard user={user} lessons={lessons} progress={progress} users={users}/>;

  return(<>
    <Navbar user={user} page={page} setPage={p=>{setPage(p);setViewMode("list");setSelLesson(null)}} onLogout={handleLogout}/>
    <main style={{flex:1,paddingBottom:40}}>{content}</main>
    <footer style={{background:"var(--navy)",padding:"20px 24px",textAlign:"center",color:"rgba(255,255,255,.4)",fontSize:".8rem"}}>
      Curtain Academy © 2026 — ระบบเรียนรู้ผ้าม่านออนไลน์ {useFirebase&&"| 🔥 Firebase Connected"}
    </footer>
    <Toast toasts={toasts}/>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
